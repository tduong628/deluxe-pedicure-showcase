<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deluxe Nail Spa — Pedicure Menu Display</title>
<style>
  :root { --slide-w: 1080; --slide-h: 1920; --slide-ms: 12000ms; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#0c0b0a; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body { cursor:none; }
  /* Stage: fixed 1080x1920, scaled to fit any portrait screen */
  #stage {
    position:absolute; top:50%; left:50%;
    width:1080px; height:1920px;
    transform-origin:center center;
    overflow:hidden;
    background:#F7ECD8;
  }
  .layer {
    position:absolute; inset:0;
    overflow:hidden;
    opacity:0;
    background:#F7ECD8;
    transition: opacity 1000ms ease-in-out;
    will-change:opacity;
  }
  .layer.active { opacity:1; }
  .layer img {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    display:block;
    background:#F7ECD8;
    transform:scale(1);
    transform-origin:center center;
  }
  /* Ken Burns: slow subtle zoom over the full on-screen duration of a slide */
  .layer img.kb {
    animation: kenburns var(--slide-ms) linear forwards;
  }
  @keyframes kenburns {
    from { transform:scale(1); }
    to   { transform:scale(1.04); }
  }
  /* Progress dots */
  #progress {
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
    display:flex; gap:14px; z-index:50;
    padding:12px 22px; border-radius:999px;
    background:rgba(20,18,16,0.28);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  }
  .dot {
    width:9px; height:9px; border-radius:50%;
    background:rgba(255,255,255,0.34);
    transition: all .5s ease;
  }
  .dot.on { background:#E8C9A0; width:30px; border-radius:6px; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="layA"><img id="imgA" alt="" src=""></div>
  <div class="layer" id="layB"><img id="imgB" alt="" src=""></div>

  <div id="progress"></div>
</div>

<script>
(function () {
  // Poster manifest — full-bleed ChatGPT-generated designs, John's fixed order
  var POSTER_DIR = "styles/bento/assets/posters/";
  var SLIDES = [
    { src: POSTER_DIR + "poster-ocean-breeze.png",   label: "Ocean Breeze Pedicure" },
    { src: POSTER_DIR + "poster-fall-winter.png",    label: "Fall/Winter Pedicure Special" },
    { src: POSTER_DIR + "poster-honey-orange.png",   label: "Honey Orange Zest Pedicure" },
    { src: POSTER_DIR + "poster-herbal.png",         label: "Herbal Spa Pedicure Ritual" },
    { src: POSTER_DIR + "poster-romantic-rose.png",  label: "Romantic Rose Pedicure" },
    { src: POSTER_DIR + "poster-lavender.png",       label: "Lavender Spa Pedicure" },
    { src: POSTER_DIR + "poster-basic-spa.png",      label: "Basic Spa Pedicure" },
    { src: POSTER_DIR + "poster-pearl-steam.png",    label: "The Pearl & Steam Experience" },
    { src: POSTER_DIR + "poster-green-tea.png",      label: "Green Tea Pedicure" },
    { src: POSTER_DIR + "poster-collagen.png",       label: "Collagen Spa Experience" }
  ];
  var SLIDE_MS = 12000;          // 12s per slide (John's established pacing)
  var SLIDE_W = 1080, SLIDE_H = 1920;

  var stage = document.getElementById('stage');
  var layers = [
    { el: document.getElementById('layA'), img: document.getElementById('imgA') },
    { el: document.getElementById('layB'), img: document.getElementById('imgB') }
  ];
  var progress = document.getElementById('progress');

  // Build progress dots
  SLIDES.forEach(function (_, i) {
    var d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' on' : '');
    progress.appendChild(d);
  });
  var dots = progress.querySelectorAll('.dot');

  // Scale stage to fit viewport, preserving 1080x1920 aspect (portrait)
  function fit() {
    var sw = window.innerWidth, sh = window.innerHeight;
    var scale = Math.min(sw / SLIDE_W, sh / SLIDE_H);
    stage.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  function restartKenBurns(imgEl) {
    imgEl.classList.remove('kb');
    void imgEl.offsetWidth; // force reflow so the animation restarts cleanly
    imgEl.classList.add('kb');
  }

  var idx = 0;             // currently visible slide index
  var front = 0;           // which layer is currently active (0 or 1)
  var timer = null;

  // Prime: load slide 0 into layer 0, show it, start its zoom immediately
  layers[0].img.src = SLIDES[0].src;
  layers[0].img.alt = SLIDES[0].label;
  layers[0].el.classList.add('active');
  restartKenBurns(layers[0].img);

  function go(next) {
    var back = 1 - front;
    var bl = layers[back];

    bl.img.alt = SLIDES[next].label;
    bl.img.src = SLIDES[next].src;

    var swapped = false;
    function reveal() {
      if (swapped) return;
      swapped = true;
      restartKenBurns(bl.img);
      bl.el.classList.add('active');
      layers[front].el.classList.remove('active');
      front = back;
      idx = next;
      dots.forEach(function (d, i) { d.classList.toggle('on', i === idx); });
    }
    bl.img.onload = reveal;
    // Safety: reveal even if onload doesn't fire (e.g. cached image, no event)
    setTimeout(reveal, 1200);
  }

  function tick() {
    var next = (idx + 1) % SLIDES.length;
    go(next);
  }

  function start() {
    stop();
    if (!document.hidden) timer = setInterval(tick, SLIDE_MS);
  }
  function stop() {
    if (timer !== null) { clearInterval(timer); timer = null; }
  }
  start();

  document.addEventListener('keydown', function (e) {
    if (e.key.toLowerCase() === 'f') {
      e.preventDefault();
      toggleFs();
    }
  });

  function toggleFs() {
    var result;
    try {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          result = document.documentElement.requestFullscreen();
        }
      } else if (document.exitFullscreen) {
        result = document.exitFullscreen();
      }
      if (result && result.catch) result.catch(function () {});
    } catch (_) { /* Fullscreen may be unavailable in an embedded browser. */ }
  }

  // Pause rotation while the page/tab is hidden; resume on return.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else start();
  });
})();
</script>
</body>
</html>
