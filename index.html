<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deluxe Nail Spa — Pedicure Menu Display</title>
<style>
  :root { --slide-w: 1080; --slide-h: 1920; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#0c0b0a; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body { cursor:none; }
  /* Stage: fixed 1080x1920, scaled to fit any portrait screen */
  #stage {
    position:absolute; top:50%; left:50%;
    width:1080px; height:1920px;
    transform-origin:center center;
    overflow:hidden;
    background:#F5E6D8;
  }
  .layer {
    position:absolute; inset:0;
    transform:translateX(100%);
    transition:transform 1.1s cubic-bezier(0.22,0.61,0.36,1);
    will-change:transform;
    pointer-events:none;
  }
  #layA { transform:translateX(-100%); }
  #layB { transform:translateX(0%); }
  .layer iframe {
    width:1080px; height:1920px; border:0; display:block;
    background:#F5E6D8;
  }
  /* Progress dots */
  #progress {
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
    display:flex; gap:14px; z-index:50;
    padding:12px 22px; border-radius:999px;
    background:rgba(20,18,16,0.32);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    opacity:1; transition:opacity .4s ease;
  }
  #stage:hover #progress { opacity:1; }
  .dot {
    width:9px; height:9px; border-radius:50%;
    background:rgba(255,255,255,0.34);
    transition: all .5s ease;
  }
  .dot.on { background:#E8C9A0; width:30px; border-radius:6px; }
  /* Idle hint */
  #hint {
    position:absolute; top:24px; left:50%; transform:translateX(-50%);
    z-index:60; color:rgba(255,255,255,0.7);
    font-size:14px; letter-spacing:.14em; text-transform:uppercase;
    padding:10px 20px; border-radius:999px; white-space:nowrap;
    background:rgba(20,18,16,0.34); backdrop-filter:blur(14px);
    opacity:1; transition:opacity .5s ease; pointer-events:none;
  }
  #stage:hover #hint { opacity:1; }
  #fs-btn {
    position:absolute; bottom:28px; right:34px; z-index:60;
    width:52px; height:52px; border-radius:50%; border:0; cursor:none;
    background:rgba(20,18,16,0.4); color:#fff; font-size:20px;
    backdrop-filter:blur(14px); display:flex; align-items:center; justify-content:center;
    opacity:1; transition:opacity .4s ease;
  }
  #stage:hover #fs-btn { opacity:1; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="layA"><iframe id="frA" src="about:blank" title="Previous slide" tabindex="-1"></iframe></div>
  <div class="layer" id="layB"><iframe id="frB" src="about:blank" title="Current slide" tabindex="-1"></iframe></div>
  <div class="layer" id="layC"><iframe id="frC" src="about:blank" title="Next slide" tabindex="-1"></iframe></div>

  <div id="hint">Deluxe Nail Spa · Pedicure Menu — press F for fullscreen</div>
  <div id="progress"></div>
  <button id="fs-btn" title="Fullscreen (F)">⤢</button>
</div>

<script>
(function () {
  // Slide manifest — same order and labels as deluxe-slideshow.html
  var SLIDES = [
    { src: "styles/bento/slide-01-ocean-breeze.html",     label: "Ocean Breeze Pedicure" },
    { src: "styles/bento/slide-02-summer-pedicure.html",  label: "Summer Pedicure Special" },
    { src: "styles/bento/slide-03-honey-orange.html",     label: "Honey Orange Zest Pedicure" },
    { src: "styles/bento/slide-04-zen-herbal.html",       label: "Herbal Spa Pedicure Ritual" },
    { src: "styles/bento/slide-05-romantic-rose.html",    label: "Romantic Rose Pedicure" },
    { src: "styles/bento/slide-06-lavender-spa.html",     label: "Lavender Spa Pedicure" },
    { src: "styles/bento/slide-07-basic-spa.html",        label: "Basic Spa Pedicure" },
    { src: "styles/bento/slide-08-pearl-steam.html",      label: "The Pearl & Steam Experience" },
    { src: "styles/bento/slide-09-green-tea.html",        label: "Green Tea Pedicure" },
    { src: "styles/bento/slide-10-collagen-spa.html",     label: "Collagen Spa Experience" }
  ];
  var SLIDE_MS = 12000;          // 12s per slide (John's choice)
  var SLIDE_W = 1080, SLIDE_H = 1920;

  var stage = document.getElementById('stage');
  var layers = [
    { el: document.getElementById('layA'), fr: document.getElementById('frA') },
    { el: document.getElementById('layB'), fr: document.getElementById('frB') },
    { el: document.getElementById('layC'), fr: document.getElementById('frC') }
  ];
  var progress = document.getElementById('progress');

  // Build progress dots
  SLIDES.forEach(function (_, i) {
    var d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' on' : '');
    progress.appendChild(d);
  });
  var dots = progress.querySelectorAll('.dot');

  // Scale stage to fit viewport, preserving 1080x1920 aspect (portrait)
  function fit() {
    var sw = window.innerWidth, sh = window.innerHeight;
    var scale = Math.min(sw / SLIDE_W, sh / SLIDE_H);
    stage.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  // Ring buffer: previous, current, next. Only the incoming frame is loaded.
  var previous = layers[0], current = layers[1], next = layers[2];
  var idx = 0;
  var timer = null;
  var busy = false;
  var pendingReveal = null;

  function position(layer, percent) {
    layer.el.style.transform = 'translateX(' + percent + '%)';
  }

  current.fr.title = SLIDES[0].label;
  current.fr.src = SLIDES[0].src;

  function go(direction) {
    if (busy || document.hidden) return;
    busy = true;
    var target = (idx + direction + SLIDES.length) % SLIDES.length;
    var incoming = direction === 1 ? next : previous;
    var outgoing = current;
    var revealed = false;

    function reveal() {
      if (revealed) return;
      if (document.hidden) { pendingReveal = reveal; return; }
      revealed = true;
      pendingReveal = null;
      incoming.fr.onload = null;
      // Commit the offscreen position before starting both transforms together.
      void incoming.el.offsetWidth;
      position(incoming, 0);
      position(outgoing, -direction * 100);
      idx = target;
      dots.forEach(function (d, i) { d.classList.toggle('on', i === idx); });

      var finished = false;
      var fallback;
      function finish(e) {
        if (e && (e.target !== incoming.el || e.propertyName !== 'transform')) return;
        if (finished) return;
        finished = true;
        clearTimeout(fallback);
        incoming.el.removeEventListener('transitionend', finish);
        // Rotate roles; move the unused blank layer to the opposite edge instantly.
        if (direction === 1) {
          var spare = previous;
          previous = outgoing;
          current = incoming;
          next = spare;
        } else {
          var spare = next;
          next = outgoing;
          current = incoming;
          previous = spare;
        }
        spare.el.style.transition = 'none';
        position(spare, direction * 100);
        void spare.el.offsetWidth;
        spare.el.style.transition = '';
        outgoing.fr.src = 'about:blank';
        busy = false;
      }
      incoming.el.addEventListener('transitionend', finish);
      fallback = setTimeout(function () { finish(); }, 1400);
    }

    // Load fresh on every visit so each page's entrance animation starts again.
    incoming.fr.title = SLIDES[target].label;
    incoming.fr.onload = function () {
      // Ignore a queued load event from unloading this frame on its last visit.
      if (incoming.fr.contentWindow.location.href === 'about:blank') return;
      incoming.fr.onload = null;
      requestAnimationFrame(function () { requestAnimationFrame(reveal); });
    };
    incoming.fr.src = SLIDES[target].src;
  }

  function tick() { go(1); }
  function start() {
    stop();
    if (!document.hidden) timer = setInterval(tick, SLIDE_MS);
  }
  function stop() {
    if (timer !== null) { clearInterval(timer); timer = null; }
  }
  start();

  function manualGo(direction) {
    if (busy || document.hidden) return;
    stop();
    go(direction);
    start();
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault(); manualGo(1);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault(); manualGo(-1);
    } else if (e.key.toLowerCase() === 'f') {
      e.preventDefault(); toggleFs();
    }
  });

  function toggleFs() {
    var result;
    try {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          result = document.documentElement.requestFullscreen();
        }
      } else if (document.exitFullscreen) {
        result = document.exitFullscreen();
      }
      if (result && result.catch) result.catch(function () {});
    } catch (_) { /* Fullscreen may be unavailable in an embedded browser. */ }
  }
  document.getElementById('fs-btn').addEventListener('click', toggleFs);

  // Pause rotation while the page/tab is hidden; resume on return.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      stop();
    } else {
      if (pendingReveal) pendingReveal();
      start();
    }
  });
})();
</script>
</body>
</html>
