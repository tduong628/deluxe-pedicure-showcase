<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>Deluxe Nail Spa — Basic Spa Pedicure</title>

<!-- fonts vendored locally -->

<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<link href="../../vendor/fonts-editorial/fonts-editorial.css" rel="stylesheet">

<link href="../../vendor/mini-tw.css" rel="stylesheet">
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../vendor/framer-motion.js"></script>
<script src="../../vendor/babel.min.js"></script>

<style>
  /* Rows 1768px + five 16px gaps + two 36px paddings = 1920px. */
  :root{ --glass-fill:rgba(255, 251, 246, 0.42);--glass-stroke:rgba(255, 255, 255, 0.55);--glass-shadow:0 24px 60px -20px rgba(60, 40, 20, 0.22), 0 6px 16px -8px rgba(60, 40, 20, 0.16);--fw-cream:#F7ECD8;--fw-cream-deep:#F3E3C9;--fw-burgundy:#7A2130;--fw-burgundy-light:#8C2A3A;--fw-gold:#C9A24A;--fw-gold-deep:#B8862E;--fw-charcoal:#2B221A;--fw-charcoal-muted:rgba(43,34,26,0.62); }
  html, body{ width:1080px;height:1920px;margin:0;padding:0;background:var(--fw-cream);overflow:hidden;font-family:'Cormorant Garamond',serif;color:var(--fw-charcoal);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility; }
  #root{ width:1080px;height:1920px;position:relative; }
  .glass{ position:relative;background:var(--glass-fill);-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%);border:1px solid var(--glass-stroke);box-shadow:var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.45);border-radius:28px;overflow:hidden; }
  .glass-strong{ background:rgba(255, 251, 246, 0.58); }
  .glass::after{ content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));pointer-events:none;z-index:0;opacity:.4; }
  .gold-frame{ position:absolute;inset:0;pointer-events:none;border-radius:inherit; }
  *{ box-sizing:border-box; }
  body{ cursor:none; }
  h1,h2,h3,p{ margin:0; }
  .stage{ position:absolute;inset:0;background:radial-gradient(ellipse at 0% 38%,rgba(122,33,48,.14),transparent 52%),radial-gradient(ellipse at 95% 82%,rgba(201,162,74,.24),transparent 55%),linear-gradient(165deg,var(--fw-cream),var(--fw-cream-deep)); }
  .orb{ position:absolute;border-radius:50%;filter:blur(60px);mix-blend-mode:multiply;opacity:.22;pointer-events:none; }
  .orb-1{ width:520px;height:520px;left:-180px;top:220px;background:radial-gradient(circle,var(--fw-burgundy),transparent 65%); }
  .orb-2{ width:600px;height:600px;right:-200px;top:640px;background:radial-gradient(circle,var(--fw-gold),transparent 65%); }
  .orb-3{ width:480px;height:480px;left:60px;bottom:-100px;background:radial-gradient(circle,var(--fw-burgundy-light),transparent 65%);opacity:.12; }
  .content-frame{ position:relative;width:100%;height:100%;padding:36px 44px;display:grid;grid-template-rows:150px 300px 420px 308px 330px 260px;gap:16px; }
  .glass > :not(.gold-frame){ position:relative;z-index:1; }
  .caps{ font-family:'Cormorant SC',serif;text-transform:uppercase;letter-spacing:.12em;font-weight:600; }
  .script{ font-family:'Great Vibes',cursive;color:var(--fw-gold-deep);font-weight:400; }
  .header-row{ padding:20px 28px 12px;display:grid;grid-template-columns:1fr 1fr;align-items:center; }
  .wordmark{ font-size:35px;letter-spacing:.12em;white-space:nowrap; }
  .wordmark span{ color:var(--fw-gold-deep); }
  .brand-subline{ font-size:15px;margin-top:5px;letter-spacing:.2em; }
  .collection-lockup{ text-align:right; }
  .collection-badge{ display:inline-block;border:1px solid var(--fw-gold);border-radius:40px;padding:8px 23px;text-align:center;font-size:16px;line-height:1.35;color:var(--fw-burgundy); }
  .divider-rule{ display:flex;align-items:center;gap:12px;color:var(--fw-gold-deep); }
  .divider-rule:before,.divider-rule:after{ content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--fw-gold)); }
  .divider-rule:after{ transform:rotate(180deg); }
  .header-row .divider-rule{ grid-column:1/-1; }
  .divider-rule svg{ width:20px;height:20px;flex-shrink:0; }
  .headline-panel{ padding:16px 30px;text-align:center;display:flex;flex-direction:column;justify-content:center; }
  h1{ font-size:62px;line-height:.98;font-weight:400; }
  h1 em{ color:var(--fw-burgundy);font-weight:400; }
  .headline-panel .caps{ font-size:18px;margin-top:18px; }
  .intro{ font-size:26px;line-height:1.16;max-width:840px;margin:12px auto 0; }
  .price-seal{ width:246px;height:246px;flex-shrink:0;border:1.5px solid var(--fw-gold);border-radius:50%;background:var(--fw-cream);color:var(--fw-burgundy);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 5px rgba(247,236,216,.6),0 8px 22px rgba(122,33,48,.08);margin:auto; }
  .price-seal .caps{ font-size:21px; }
  .price-total{ font-size:78px;font-weight:700;line-height:.94;margin:3px 0; }
  .price-inclusions{ font-size:15px;line-height:1.3;width:190px;margin-top:12px;font-family:'Jost',sans-serif;color:var(--fw-charcoal-muted); }
  .price-note-line{ font-size:12px;letter-spacing:.1em;margin-top:9px;color:var(--fw-burgundy); }
  .info-strip{ display:grid;grid-template-columns:repeat(2,1fr);align-items:center;padding:22px 40px;max-width:820px;margin:0 auto; }
  .info-item{ text-align:center;padding:0 24px; }
  .info-item + .info-item{ border-left:1px solid rgba(201,162,74,.6); }
  .info-item svg{ width:52px;height:52px;margin:0 auto 18px;display:block; }
  .info-item h3{ font-size:22px;color:var(--fw-burgundy);margin-bottom:12px; }
  .info-item p{ font-family:'Jost',sans-serif;font-size:18px;font-style:italic;line-height:1.35; }
  .ritual-panel{ padding:24px 20px; }
  .section-title{ font-size:20px;white-space:nowrap; }
  .steps{ display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:44px; }
  .step{ text-align:center;position:relative; }
  .step:not(:last-child):after{ content:'›';position:absolute;right:-17px;top:27px;color:var(--fw-gold-deep);font-size:34px; }
  .icon-frame{ position:relative;width:92px;height:92px;border:1px solid var(--fw-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;background:rgba(247,236,216,.6); }
  .icon-frame > svg{ width:50px;height:50px; }
  .step-num{ position:absolute;top:-7px;left:-6px;width:29px;height:29px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--fw-burgundy);border:1px solid var(--fw-gold);color:var(--fw-cream);font:500 16px 'Jost',sans-serif; }
  .step h3{ font-size:22px;line-height:1.15;min-height:46px;font-weight:600;letter-spacing:.06em;max-width:200px;margin:0 auto; }
  .closing-panel{ padding:22px 30px 18px;display:flex;flex-direction:column;justify-content:center;gap:14px; }
  .disc-rule{ height:1px;width:100%;background:linear-gradient(90deg,transparent,rgba(201,162,74,.55),transparent); }
  .disclaimer-text{ font-family:'Jost',sans-serif;font-style:italic;font-weight:400;font-size:18px;color:var(--fw-charcoal-muted);text-align:center;line-height:1.4; }
  .footer-bar{ border:1px solid var(--fw-gold);text-align:center;padding:12px 0;font-size:16px;letter-spacing:.08em; }
  .botanical{ position:absolute;width:150px;height:260px;opacity:.16;color:var(--fw-burgundy);pointer-events:none; }
  .botanical.tl{ left:-64px;top:-50px;transform:rotate(-25deg); }
  .botanical.tr{ right:-66px;top:-40px;transform:scaleX(-1) rotate(-25deg);color:var(--fw-gold-deep); }
  .botanical.bl{ left:-65px;bottom:-35px;transform:rotate(190deg);color:var(--fw-gold-deep); }
  .botanical.br{ right:-65px;bottom:-35px;transform:rotate(160deg); }
  .price-panel{ padding:30px 36px;display:flex;flex-direction:column;justify-content:center;gap:26px; }
  .price-layout{ display:grid;grid-template-columns:1fr 270px;gap:28px;align-items:center; }
  .promise{ text-align:center; }
  .promise h2{ font-size:50px;font-weight:400;line-height:1.05;margin:16px 0; }
  .promise h2 em{ color:var(--fw-burgundy);font-weight:400; }
  .promise p{ font-family:'Jost',sans-serif;font-size:20px;line-height:1.4;color:var(--fw-charcoal-muted); }
  .promise .caps{ font-size:19px;color:var(--fw-burgundy); }
  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useEffect, useState, useRef, useMemo } = React;
const m = window.Motion.motion;

/* ── DATE-AWARE PRICE ───────────────────────────────────────────
   Before Jun 1 2026 → $35, with upcoming-change note.
   On/after Jun 1 2026 → $38, note removed entirely. */
function currentPrice(){
  var now = new Date();
  var cutover = new Date(2026, 5, 1); // June (month index 5) 1, 2026 00:00 local
  return now >= cutover
    ? { amount: "38", note: null }
    : { amount: "35", note: "$38 starting June 2026" };
}

function App(){
  // staggered spring entry (same as slide 1)
  const springIn = (delay=0)=>({
    initial:{ opacity:0, y:40, scale:0.95 },
    animate:{ opacity:1, y:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const springInLeft = (delay=0)=>({
    initial:{ opacity:0, x:-50, scale:0.95 },
    animate:{ opacity:1, x:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const springInRight = (delay=0)=>({
    initial:{ opacity:0, x:50, scale:0.95 },
    animate:{ opacity:1, x:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const breathe = (phase=0)=>({
    animate:{ y: [0, -2, 0, 2, 0] },
    transition:{ duration:4, repeat:Infinity, ease:'easeInOut', delay: phase }
  });

  // gold border draw (same as slide 1)
  const GoldFrame = ({ r=28, delay=0.4, color="rgba(201,162,74,0.55)" })=> (
    <svg className="gold-frame" viewBox="0 0 100 100" preserveAspectRatio="none">
      <m.rect
        x="0.5" y="0.5" width="99" height="99" rx={r/2.4} ry={r/2.4}
        fill="none" stroke={color} strokeWidth="0.18"
        pathLength="1"
        initial={{ pathLength: 0, opacity: 0 }}
        animate={{ pathLength: 1, opacity: 1 }}
        transition={{ duration: 1.4, delay, ease: 'easeOut' }}
      />
    </svg>
  );

  const price = currentPrice();

  const benefits = [
    { icon: <ScissorsIcon/>, title:'Routine Maintenance',
      body:'Keeps nails shaped and prevents ingrowns.' },
    { icon: <SoakIcon/>,     title:'Stress Relief',
      body:'A quiet moment to decompress with a soothing soak.' },
  ];

  const included = [
    { title:'Nail Trimming & Shaping',  icon:<TrimIcon/> },
    { title:'Cuticle Care & Detailing', icon:<CuticleIcon/> },
    { title:'Light Lotion Massage',     icon:<LotionIcon/> },
    { title:'Choice of Regular Polish', icon:<PolishIcon/> },
  ];

  return <>
    <div className="stage" aria-hidden="true">
      {[1,2,3].map(n=><m.div key={n} className={'orb orb-'+n} animate={{x:[0,25,-15,0],y:[0,-18,12,0]}} transition={{duration:18+n*2,repeat:Infinity,ease:'easeInOut',delay:n*.4}}/>)}
      {['tl','tr','bl','br'].map(c=><BotanicalCorner key={c} corner={c}/>)}
    </div>
    <div className="content-frame">
      <m.div className="glass glass-strong header-row" {...springIn(.05)}>
        <GoldFrame delay={.5}/><HeaderRow/><DividerRule/>
      </m.div>
      <m.div className="glass glass-strong headline-panel" {...springIn(.15)}>
        <GoldFrame delay={.7}/>
        <h1>Basic Spa <em>Pedicure</em></h1>
        <p className="caps">Deluxe Pedicure · The Essential</p>
        <p className="intro">Classic care. Clean results.</p>
      </m.div>
      <m.div className="glass glass-strong price-panel" {...springIn(.25)}>
        <GoldFrame delay={.85}/><DividerRule/>
        <div className="price-layout">
          <m.div className="promise" {...springInLeft(.35)}><m.div {...breathe(.1)}>
            <div className="caps">The Promise</div>
            <h2>Simple. Clean. <em>Done right.</em></h2>
            <p>Everyday nail care that keeps feet healthy</p>
          </m.div></m.div>
          <m.div {...springInRight(.4)}><PriceSeal amount={price.amount} note={price.note}/></m.div>
        </div>
        <DividerRule/>
      </m.div>
      <m.div className="glass info-strip" {...springIn(.65)}>
        <GoldFrame delay={1}/>
        {benefits.map(b=><InfoItem key={b.title} {...b}/>)}
      </m.div>
      <m.div className="glass glass-strong ritual-panel" {...springIn(.85)}>
        <GoldFrame delay={1.3}/><DividerRule><h2 className="caps section-title">What's Included</h2></DividerRule>
        <div className="steps">{included.map(({title,icon},i)=><m.div className="step" key={title} initial={{opacity:0,y:18}} animate={{opacity:1,y:0}} transition={{delay:.85+i*.08,duration:.55,ease:'easeOut'}}>
          <div className="icon-frame"><m.span className="step-num" initial={{scale:0,opacity:0}} animate={{scale:1,opacity:1}} transition={{delay:.92+i*.08,type:'spring',stiffness:260,damping:14}}>{i+1}</m.span>{icon}</div>
          <h3 className="caps">{title}</h3>
        </m.div>)}</div>
      </m.div>
      <m.div className="glass glass-strong closing-panel" {...springIn(1.15)}>
        <GoldFrame delay={1.6}/>
        <m.div className="disc-rule" initial={{scaleX:0}} animate={{scaleX:1}} transition={{delay:1.5,duration:1.0,ease:'easeOut'}} style={{transformOrigin:'center'}}/>
        <p className="disclaimer-text">Callus treatment is not included — but we're happy to add it for you. Just ask.</p>
        <m.div className="disc-rule" initial={{scaleX:0}} animate={{scaleX:1}} transition={{delay:1.55,duration:1.0,ease:'easeOut'}} style={{transformOrigin:'center'}}/>
        <FooterBar/>
      </m.div>
    </div>
  </>;
}

function HeaderRow(){return <>
  <div><div className="caps wordmark" aria-label="DELUXE NAIL SPA">DELU<span>X</span>E NAIL SPA</div><div className="caps brand-subline">BEAUTY · CARE · RELAXATION</div></div>
  <div className="collection-lockup"><div className="caps collection-badge">Essential Pedicure · Everyday Care</div></div>
</>;}
function PriceSeal({amount,note}){return <div className="price-seal"><div className="caps">From</div><div className="price-total">${amount}</div><div className="price-inclusions">Gel polish &amp; add-ons available</div>{note && <div className="caps price-note-line">Current price · {note}</div>}</div>;}
function InfoItem({icon,title,body}){return <div className="info-item">{icon}<h3 className="caps">{title}</h3><p>{body}</p></div>;}
function FooterBar(){return <div className="caps footer-bar">Deluxe Nail Spa · Ask the front desk</div>;}
function DividerRule({children}){return <div className="divider-rule"><LeafIcon/>{children}{children && <LeafIcon/>}</div>;}
function LeafIcon(){return <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20Q2 3 21 3Q21 21 4 20ZM4 20L16 8" stroke="currentColor" strokeWidth="1.4" fill="rgba(201,162,74,.12)"/></svg>;}
function BotanicalCorner({corner}){return <svg className={'botanical '+corner} viewBox="0 0 150 260" fill="none"><path d="M70 250Q110 125 55 10" stroke="currentColor" strokeWidth="2"/>{[0,1,2,3,4].map(n=><g key={n} transform={'translate(0 '+n*43+')'}><path d="M77 48Q12 35 34 3Q75 14 77 48ZM80 58Q135 40 121 13Q87 23 80 58Z" fill="currentColor"/></g>)}</svg>;}

/* ── benefit icons ─────────────────────────────────────────── */
function ScissorsIcon(){
  /* routine maintenance — nail scissors / shaping */
  return (
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
      <circle cx="9" cy="22" r="3.4" stroke="var(--fw-burgundy)" strokeWidth="1.6" fill="rgba(122,33,48,0.22)"/>
      <circle cx="9" cy="10" r="3.4" stroke="var(--fw-burgundy)" strokeWidth="1.6" fill="rgba(122,33,48,0.22)"/>
      <path d="M12 12 L 27 21" stroke="var(--fw-burgundy)" strokeWidth="1.6" strokeLinecap="round"/>
      <path d="M12 20 L 27 11" stroke="var(--fw-burgundy)" strokeWidth="1.6" strokeLinecap="round"/>
      <circle cx="16" cy="16" r="1.1" fill="var(--fw-gold-deep)"/>
    </svg>
  );
}
function SoakIcon(){
  /* stress relief — bowl + soothing steam */
  return (
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
      <path d="M14 7 C 14 5, 16 5, 16 7 C 16 9, 14 9, 14 11" stroke="var(--fw-gold-deep)" strokeWidth="1.4" strokeLinecap="round" fill="none"/>
      <path d="M19 6 C 19 4.5, 20.5 4.5, 20.5 6 C 20.5 7.5, 19 7.5, 19 9" stroke="var(--fw-gold-deep)" strokeWidth="1.3" strokeLinecap="round" fill="none"/>
      <path d="M5 16 H 27 C 26 24, 21 28, 16 28 C 11 28, 6 24, 5 16 Z"
        stroke="var(--fw-burgundy)" strokeWidth="1.6" strokeLinejoin="round" fill="rgba(122,33,48,0.20)"/>
      <ellipse cx="16" cy="16" rx="11" ry="2" stroke="var(--fw-burgundy)" strokeWidth="1.6" fill="rgba(122,33,48,0.30)"/>
    </svg>
  );
}

/* ── included-step icons ─────────────────────────────────────────── */
function TrimIcon(){
  /* nail trimming & shaping — clipper */
  return (
    <svg width="34" height="34" viewBox="0 0 38 38" fill="none">
      <path d="M9 16 L 27 16 C 29 16, 30 17.5, 30 19 C 30 20.5, 29 22, 27 22 L 9 22 Z"
        stroke="var(--fw-burgundy)" strokeWidth="1.6" strokeLinejoin="round" fill="rgba(122,33,48,0.18)"/>
      <path d="M9 22 L 27 28 L 27 22" stroke="var(--fw-burgundy)" strokeWidth="1.6" strokeLinejoin="round" fill="rgba(122,33,48,0.12)"/>
      <path d="M18 9 L 18 16" stroke="var(--fw-gold-deep)" strokeWidth="1.6" strokeLinecap="round"/>
      <circle cx="18" cy="8" r="2" stroke="var(--fw-burgundy)" strokeWidth="1.4" fill="rgba(122,33,48,0.3)"/>
      <line x1="13" y1="19" x2="24" y2="19" stroke="var(--fw-gold-deep)" strokeWidth="1.3" strokeLinecap="round"/>
    </svg>
  );
}
function CuticleIcon(){
  /* cuticle care — cuticle pusher tool + detail */
  return (
    <svg width="34" height="34" viewBox="0 0 38 38" fill="none">
      <path d="M18 6 L 20 8 L 20 27 C 20 29, 19 30, 18 30 C 17 30, 16 29, 16 27 L 16 8 Z"
        stroke="var(--fw-burgundy)" strokeWidth="1.6" strokeLinejoin="round" fill="rgba(122,33,48,0.18)"/>
      <path d="M16 9 L 20 9" stroke="var(--fw-burgundy)" strokeWidth="1.4"/>
      <path d="M16.5 27 C 17 28.5, 19 28.5, 19.5 27" stroke="var(--fw-gold-deep)" strokeWidth="1.4" strokeLinecap="round" fill="none"/>
      <circle cx="18" cy="6" r="1.6" stroke="var(--fw-burgundy)" strokeWidth="1.3" fill="rgba(122,33,48,0.3)"/>
      <path d="M25 14 C 27 13, 29 14, 30 16" stroke="var(--fw-gold-deep)" strokeWidth="1.3" strokeLinecap="round" fill="none"/>
    </svg>
  );
}
function LotionIcon(){
  /* light lotion massage — pump bottle */
  return (
    <svg width="34" height="34" viewBox="0 0 38 38" fill="none">
      <path d="M17 7 H 22 V 10 H 17 Z" stroke="var(--fw-burgundy)" strokeWidth="1.6" fill="rgba(122,33,48,0.30)"/>
      <path d="M19.5 7 V 4 H 23 V 6" stroke="var(--fw-gold-deep)" strokeWidth="1.5" strokeLinecap="round" fill="none"/>
      <path d="M14 13 H 24 V 29 C 24 30.5, 23 31, 21.5 31 H 16.5 C 15 31, 14 30.5, 14 29 Z"
        stroke="var(--fw-burgundy)" strokeWidth="1.6" strokeLinejoin="round" fill="rgba(122,33,48,0.18)"/>
      <path d="M14 13 L 17 10 H 21 L 24 13" stroke="var(--fw-burgundy)" strokeWidth="1.6" strokeLinejoin="round" fill="rgba(122,33,48,0.12)"/>
      <line x1="17" y1="20" x2="21" y2="20" stroke="var(--fw-gold-deep)" strokeWidth="1.4" strokeLinecap="round"/>
      <line x1="17" y1="24" x2="21" y2="24" stroke="var(--fw-gold-deep)" strokeWidth="1.4" strokeLinecap="round"/>
    </svg>
  );
}
function PolishIcon(){
  /* choice of regular polish — bottle + brush */
  return (
    <svg width="34" height="34" viewBox="0 0 38 38" fill="none">
      <path d="M16 13 H 24 V 28 C 24 30, 22.5 31, 20 31 C 17.5 31, 16 30, 16 28 Z"
        stroke="var(--fw-burgundy)" strokeWidth="1.6" strokeLinejoin="round" fill="rgba(122,33,48,0.24)"/>
      <rect x="17.5" y="9" width="5" height="4" rx="0.8" stroke="var(--fw-burgundy)" strokeWidth="1.5" fill="rgba(122,33,48,0.32)"/>
      <path d="M20 9 V 5 M20 5 L 17.5 6.5 M20 5 L 22.5 6.5" stroke="var(--fw-gold-deep)" strokeWidth="1.5" strokeLinecap="round"/>
      <path d="M27 11 L 23 19" stroke="var(--fw-gold-deep)" strokeWidth="1.5" strokeLinecap="round"/>
      <path d="M22 18 L 24.5 19.5 L 22 21 Z" stroke="var(--fw-burgundy)" strokeWidth="1.3" strokeLinejoin="round" fill="rgba(122,33,48,0.4)"/>
      <line x1="18.5" y1="20" x2="21.5" y2="20" stroke="var(--fw-gold-deep)" strokeWidth="1.3" strokeLinecap="round"/>
    </svg>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
