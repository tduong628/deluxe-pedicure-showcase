<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>Deluxe Nail Spa — Ocean Breeze Pedicure</title>

<!-- fonts vendored locally -->

<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<link href="../../vendor/fonts-editorial/fonts-editorial.css" rel="stylesheet">

<link href="../../vendor/mini-tw.css" rel="stylesheet">
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../vendor/framer-motion.js"></script>
<script src="../../vendor/babel.min.js"></script>

<style>
  :root{
    --cream-100:#F5E6D8;
    --cream-200:#E8D5C4;
    --cream-300:#D4B8A0;
    --blush:#E8C4B4;
    --sage:#B5C4A8;
    --gold:#B8965A;
    --gold-hi:#D4B886;
    --charcoal:#1F1B16;
    --charcoal-soft:rgba(31,27,22,0.78);
    --charcoal-muted:rgba(31,27,22,0.55);
    --glass-fill:rgba(255, 251, 246, 0.42);
    --glass-stroke:rgba(255, 255, 255, 0.55);
    --glass-shadow: 0 24px 60px -20px rgba(60, 40, 20, 0.22), 0 6px 16px -8px rgba(60, 40, 20, 0.16);

    --fw-cream:#F7ECD8;
    --fw-cream-deep:#F3E3C9;
    --fw-burgundy:#7A2130;
    --fw-burgundy-light:#8C2A3A;
    --fw-gold:#C9A24A;
    --fw-gold-deep:#B8862E;
    --fw-charcoal:#2B221A;
    --fw-charcoal-muted:rgba(43,34,26,0.62);
  }
  html, body{
    width:1080px; height:1920px; margin:0; padding:0;
    background:var(--fw-cream);
    overflow:hidden;
    font-family: 'Cormorant Garamond', serif;
    color: var(--fw-charcoal);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root{ width:1080px; height:1920px; position:relative; }
  .glass{
    position:relative;
    background: var(--glass-fill);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--glass-stroke);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.45);
    border-radius: 28px;
    overflow:hidden;
  }
  .glass-strong{
    background: rgba(255, 251, 246, 0.58);
  }
  .glass::after{
    content:""; position:absolute; left:0; right:0; top:0; height:50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
    pointer-events:none;
  }
  .gold-frame{
    position:absolute; inset:0; pointer-events:none;
    border-radius:inherit;
  }
  .stage{ position:absolute; inset:0; background:radial-gradient(ellipse at 0% 38%,rgba(122,33,48,.14),transparent 52%),radial-gradient(ellipse at 95% 82%,rgba(201,162,74,.24),transparent 55%),linear-gradient(165deg,var(--fw-cream),var(--fw-cream-deep)); }
  .orb{ position:absolute; border-radius:50%; filter:blur(60px); mix-blend-mode:multiply; opacity:.22; pointer-events:none; }
  .orb-1{ width:520px;height:520px;left:-180px;top:220px;background:radial-gradient(circle,var(--fw-burgundy),transparent 65%); }
  .orb-2{ width:600px;height:600px;right:-200px;top:640px;background:radial-gradient(circle,var(--fw-gold),transparent 65%); }
  .orb-3{ width:480px;height:480px;left:60px;bottom:-100px;background:radial-gradient(circle,var(--fw-burgundy-light),transparent 65%);opacity:.12; }
  .script{ font-family:'Great Vibes',cursive;color:var(--fw-gold-deep);font-weight:400; }
  .header-row{ padding:20px 28px 12px;display:grid;grid-template-columns:1fr 1fr;align-items:center; }
  .wordmark{ font-size:35px;letter-spacing:.12em;white-space:nowrap; }
  .wordmark span{ color:var(--fw-gold-deep); }
  .brand-subline{ font-size:15px;margin-top:5px;letter-spacing:.2em; }
  .collection-lockup{ text-align:right; }
  .collection-badge{ display:inline-block;border:1px solid var(--fw-gold);border-radius:40px;padding:8px 23px;text-align:center;font-size:16px;line-height:1.35;color:var(--fw-burgundy); }
  .divider-rule{ display:flex;align-items:center;gap:12px;color:var(--fw-gold-deep); }
  .divider-rule:before,.divider-rule:after{ content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--fw-gold)); }
  .divider-rule:after{ transform:rotate(180deg); }
  .header-row .divider-rule{ grid-column:1/-1; }
  .divider-rule svg{ width:20px;height:20px;flex-shrink:0; }
  .price-seal{ width:200px;height:200px;flex-shrink:0;border:1.5px solid var(--fw-gold);border-radius:50%;background:var(--fw-cream);color:var(--fw-burgundy);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 5px rgba(247,236,216,.6),0 8px 22px rgba(122,33,48,.08); }
  .price-seal .caps{ font-size:13px; }
  .step{ text-align:center;position:relative; }
  .step:not(:last-child):after{ content:'›';position:absolute;right:-13px;top:20px;color:var(--fw-gold-deep);font-size:34px; }
  .icon-frame{ position:relative;width:76px;height:76px;border:1px solid var(--fw-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;background:rgba(247,236,216,.6); }
  .icon-frame > svg, .icon-frame > img{ width:44px;height:44px; }
  .step-num{ position:absolute;top:-7px;left:-6px;width:29px;height:29px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--fw-burgundy);border:1px solid var(--fw-gold);color:var(--fw-cream);font:500 16px 'Jost',sans-serif; }
  .footer-bar{ border:1px solid var(--fw-gold);text-align:center;padding:8px 0;font-size:14px;letter-spacing:.13em; }
  .botanical{ position:absolute;width:150px;height:260px;opacity:.16;color:var(--fw-burgundy); }
  .botanical.tl{ left:-64px;top:-50px;transform:rotate(-25deg); }
  .botanical.tr{ right:-66px;top:-40px;transform:scaleX(-1) rotate(-25deg);color:var(--fw-gold-deep); }
  .botanical.bl{ left:-65px;bottom:-35px;transform:rotate(190deg);color:var(--fw-gold-deep); }
  .botanical.br{ right:-65px;bottom:-35px;transform:rotate(160deg); }

  *{box-sizing:border-box;}
  body{cursor:none;}
  h1,h2,h3,p{margin:0;}
  .caps{font-family:'Cormorant SC',serif;text-transform:uppercase;letter-spacing:.13em;font-weight:600;}
  .content-frame{position:relative;width:100%;height:100%;padding:36px 44px;display:grid;grid-template-rows:140px 630px 240px 48px 252px 48px 334px 44px;gap:16px;}
  .header-row{grid-template-columns:1fr auto;}
  .collection-badge{max-width:390px;font-size:15px;padding:10px 20px;}
  .panel-content{position:relative;z-index:1;}
  .hero-img{width:100%;height:100%;object-fit:cover;object-position:center 46%;display:block;}
  .hero-fallback{position:absolute;inset:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 25%,var(--fw-cream),transparent 65%),linear-gradient(170deg,var(--fw-gold),var(--fw-burgundy),var(--fw-charcoal));}
  .hero-vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(43,34,26,.08) 20%,rgba(43,34,26,.18) 40%,rgba(43,34,26,.88) 100%),linear-gradient(90deg,rgba(43,34,26,.22),transparent 70%);}
  .hero-eyebrow-pill{position:absolute;z-index:1;top:28px;left:30px;padding:10px 18px;display:flex;align-items:center;gap:10px;border-radius:40px;background:rgba(247,236,216,.94);border:1px solid rgba(201,162,74,.65);color:var(--fw-burgundy);font-size:14px;}
  .hero-eyebrow-pill:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--fw-burgundy);}
  .hero-copy{position:absolute;z-index:1;left:40px;right:40px;bottom:38px;color:var(--fw-cream);text-shadow:0 2px 14px rgba(43,34,26,.4);}
  h1{font-family:'Cormorant Garamond',serif;font-size:90px;line-height:.94;font-weight:500;max-width:770px;}
  .hero-standfirst{font-size:28px;font-style:italic;margin-top:20px;line-height:1.2;}
  .promise-panel{padding:20px 36px;display:flex;align-items:center;justify-content:space-between;gap:24px;}
  .promise-copy{flex:1;}
  .promise-copy .caps{font-size:14px;color:var(--fw-burgundy);margin-bottom:12px;}
  .tagline{font-size:46px;font-weight:500;line-height:1.05;}
  .tagline em{color:var(--fw-burgundy);}
  .subtext{font-size:25px;font-style:italic;margin-top:12px;}
  .add-ons{font-family:'Jost',sans-serif;font-size:14px;color:var(--fw-charcoal-muted);margin-top:15px;}
  .price-total{font-size:64px;font-weight:700;line-height:1.05;margin-bottom:8px;}
  .price-total span{display:block;font-family:'Cormorant SC',serif;font-size:20px;font-weight:600;letter-spacing:.13em;}
  .section-heading{display:flex;align-items:center;justify-content:center;gap:18px;width:100%;}
  .section-heading h2{font-size:20px;color:var(--fw-burgundy);white-space:nowrap;}
  .hair-rule{height:1px;background:linear-gradient(90deg,transparent,var(--fw-gold),transparent);flex:1;max-width:220px;}
  .benefits{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .benefit-card{padding:24px 28px;}
  .benefit-top{display:flex;align-items:center;justify-content:space-between;}
  .benefit-top .caps{font-size:16px;color:var(--fw-gold-deep);}
  .benefit-card .icon-frame{width:60px;height:60px;margin:0;color:var(--fw-burgundy);}
  .benefit-card .icon-frame svg, .benefit-card .icon-frame img{width:36px;height:36px;}
  .benefit-card h3{font-size:30px;font-weight:700;margin-top:16px;}
  .benefit-card p{font-family:'Jost',sans-serif;font-size:15px;line-height:1.5;color:var(--fw-charcoal-muted);margin-top:8px;max-width:380px;}
  .ritual-panel{padding:32px 24px;}
  .steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;}
  .step{color:var(--fw-burgundy);}
  .step h3{font-size:20px;line-height:1.12;min-height:70px;letter-spacing:.055em;margin-bottom:10px;}
  .step p{font-family:'Jost',sans-serif;font-size:15px;line-height:1.4;color:var(--fw-charcoal-muted);}
  .footer-bar{color:var(--fw-burgundy);display:flex;align-items:center;justify-content:center;}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">

const { useEffect, useState, useRef, useMemo } = React;
const m = window.Motion.motion;
function App(){
  const springIn = (delay=0)=>({
    initial:{ opacity:0, y:40, scale:0.95 },
    animate:{ opacity:1, y:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const breathe = (phase=0)=>({
    animate:{ y: [0, -2, 0, 2, 0] },
    transition:{ duration:4, repeat:Infinity, ease:'easeInOut', delay: phase }
  });

  const GoldFrame = ({ r=28, delay=0.4, color="rgba(184,150,90,0.55)" })=> (
    <svg className="gold-frame" viewBox="0 0 100 100" preserveAspectRatio="none">
      <m.rect
        x="0.5" y="0.5" width="99" height="99" rx={r/2.4} ry={r/2.4}
        fill="none" stroke={color} strokeWidth="0.18"
        pathLength="1"
        initial={{ pathLength: 0, opacity: 0 }}
        animate={{ pathLength: 1, opacity: 1 }}
        transition={{ duration: 1.4, delay, ease: 'easeOut' }}
      />
    </svg>
  );

  // Hairline-drawing eyebrow header (rules grow outward from center text)
  const EyebrowHeader = ({ children, color="var(--fw-burgundy)", delay=0 })=>(
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:'18px', position:'relative' }}>
      <m.div className="hair-rule"
        initial={{ scaleX:0, opacity:0 }} animate={{ scaleX:1, opacity:1 }}
        transition={{ duration:0.9, delay, ease:'easeOut' }}
        style={{ transformOrigin:'right center' }}/>
      <span className="caps" style={{ fontSize:'20px', color, letterSpacing:'.13em', whiteSpace:'nowrap' }}>
        {children}
      </span>
      <m.div className="hair-rule"
        initial={{ scaleX:0, opacity:0 }} animate={{ scaleX:1, opacity:1 }}
        transition={{ duration:0.9, delay, ease:'easeOut' }}
        style={{ transformOrigin:'left center' }}/>
    </div>
  );

  const benefits = [
    { icon:<IconImg src="icon-pearl-mineral.png" alt="Pearl powder"/>, title:'Pearl Powder Power',
      body:'Rich in calcium and amino acids to brighten skin and filter UV rays.' },
    { icon:<IconImg src="icon-pearl-mineral.png" alt="Seaweed detox"/>, title:'Seaweed Detox',
      body:'A mineral-rich wrap that draws out impurities and reduces swelling.' },
  ];

  const steps = [
    { n:1, title:'Pearl Soak',
      body:'A relaxing foot bath infused with precious pearl powder for initial softening.' },
    { n:2, title:'Hydrating Scrub',
      body:'Exfoliate dead skin cells to reveal smoother, radiant skin.' },
    { n:3, title:'Seaweed Wrap with Nourishing Mask',
      body:'A detoxifying seaweed mask and wrap for deep purification and hydration.' },
    { n:4, title:'Pearl Massage Cream',
      body:'Conclude with a rich massage using pearl-infused cream for lasting moisture and glow.' },
  ];


  const icons=[
    <IconImg src="icon-warm-soak.png" alt="Pearl soak"/>,
    <IconImg src="icon-sugar-scrub.png" alt="Hydrating scrub"/>,
    <IconImg src="icon-pearl-mineral.png" alt="Seaweed wrap"/>,
    <IconImg src="icon-cream-mask.png" alt="Pearl massage cream"/>,
  ];
  return <>
    <div className="stage" aria-hidden="true">
      {[1,2,3].map(n=><m.div key={n} className={'orb orb-'+n} animate={{x:[0,25,-15,0],y:[0,-18,12,0]}} transition={{duration:18+n*2,repeat:Infinity,ease:'easeInOut',delay:n*.4}}/>)}
      {['tl','tr','bl','br'].map(c=><BotanicalCorner key={c} corner={c}/>)}
    </div>
    <main className="content-frame">
      <m.header className="glass glass-strong header-row" {...springIn(.05)}>
        <GoldFrame delay={.5}/>
        <div className="panel-content"><div className="caps wordmark" aria-label="DELUXE NAIL SPA">DELU<span>X</span>E NAIL SPA</div><div className="caps brand-subline">BEAUTY · CARE · RELAXATION</div></div>
        <div className="collection-lockup panel-content"><div className="caps collection-badge">Signature Pedicure · Deluxe House</div></div>
        <DividerRule/>
      </m.header>
      <m.section className="glass hero" {...springIn(.15)}>
        <m.div style={{width:'100%',height:'100%'}} initial={{scale:.95}} animate={{scale:[1,1.015,1]}} transition={{scale:{duration:5,repeat:Infinity,ease:'easeInOut'},opacity:{duration:1.4}}}>
<img src="assets/ocean-breeze-hero.png" alt="Calm turquoise ocean at golden-hour sunset with pearls and seaweed on the shore"
              className="hero-img"
              onError={(e)=>{ e.currentTarget.style.display='none'; e.currentTarget.parentElement.insertAdjacentHTML('beforeend', '<div class=\"hero-fallback\"></div>'); }}/>
        </m.div>
        <div className="hero-vignette"/>
        <m.div className="caps hero-eyebrow-pill" initial={{opacity:0,y:-10}} animate={{opacity:1,y:0}} transition={{delay:.95,duration:.6}}>Deluxe Pedicure · Seaweed Therapy</m.div>
        <m.div className="hero-copy" initial={{opacity:0,y:24}} animate={{opacity:1,y:0}} transition={{delay:1,duration:.7,ease:'easeOut'}}>
          <h1>Ocean Breeze Pedicure</h1>
          <p className="hero-standfirst">Brighten, detoxify, and renew with seaweed therapy.</p>
        </m.div><GoldFrame delay={.7}/>
      </m.section>
      <m.section className="glass glass-strong promise-panel" {...springIn(.3)}>
        <GoldFrame delay={.95}/>
        <m.div className="promise-copy panel-content" {...breathe(.2)}>
          <p className="caps">The Promise</p>
          <h2 className="tagline">Brighten. Detox. <em>Renew.</em></h2>
          <p className="subtext">Pearl powder + mineral-rich seaweed therapy</p>
          {/* Always shown for this regular, non-promo pedicure. */}
          <p className="add-ons">Gel polish &amp; add-ons available</p>
        </m.div>
        <m.div className="price-seal panel-content" initial={{opacity:0,scale:.4}} animate={{opacity:1,scale:1}} transition={{type:'spring',stiffness:220,damping:11,delay:.45}}>
          <div className="price-total"><span>From</span> $55</div><div className="caps">Signature Service</div>
        </m.div>
      </m.section>
      <EyebrowHeader delay={.6}>Why Choose Pearl &amp; Seaweed?</EyebrowHeader>
      <section className="benefits">
        {benefits.map((b,i)=><m.article className="glass benefit-card" key={b.title} {...springIn(.7+i*.1)}>
          <GoldFrame delay={.95+i*.1}/><m.div className="panel-content" {...breathe(i*.35)}>
            <div className="benefit-top"><div className="icon-frame">{b.icon}</div><span className="caps">0{i+1}</span></div>
            <h3>{b.title}</h3><p>{b.body}</p>
          </m.div>
        </m.article>)}
      </section>
      <EyebrowHeader delay={1}>The Four-Step Ritual</EyebrowHeader>
      <m.section className="glass glass-strong ritual-panel" {...springIn(1.1)}>
        <GoldFrame delay={1.4}/><div className="steps panel-content">
          {steps.map((s,i)=><m.div className="step" key={s.n} initial={{opacity:0,y:18}} animate={{opacity:1,y:0}} transition={{delay:1.1+i*.08,duration:.55,ease:'easeOut'}}>
            <div className="icon-frame"><m.span className="step-num" initial={{scale:0,opacity:0}} animate={{scale:1,opacity:1}} transition={{delay:1.16+i*.08,type:'spring',stiffness:260,damping:14}}>{s.n}</m.span>{icons[i]}</div>
            <h3 className="caps">{s.title}</h3><p>{s.body}</p>
          </m.div>)}
        </div>
      </m.section>
      <m.footer className="caps footer-bar" {...springIn(1.6)}>Deluxe Nail Spa · Ask the front desk</m.footer>
    </main>
  </>;
}
function DividerRule({children}){return <div className="divider-rule"><LeafIcon/>{children}{children && <LeafIcon/>}</div>;}
function LeafIcon(){return <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20Q2 3 21 3Q21 21 4 20ZM4 20L16 8" stroke="currentColor" strokeWidth="1.4" fill="rgba(201,162,74,.12)"/></svg>;}
function BotanicalCorner({corner}){return <svg className={'botanical '+corner} viewBox="0 0 150 260" fill="none"><path d="M70 250Q110 125 55 10" stroke="currentColor" strokeWidth="2"/>{[0,1,2,3,4].map(n=><g key={n} transform={'translate(0 '+n*43+')'}><path d="M77 48Q12 35 34 3Q75 14 77 48ZM80 58Q135 40 121 13Q87 23 80 58Z" fill="currentColor"/></g>)}</svg>;}
function IconImg({src,alt}){return <img src={'assets/icons/'+src} alt={alt} style={{objectFit:'contain',display:'block'}}/>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
