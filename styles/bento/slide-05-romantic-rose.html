<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>Deluxe Nail Spa — Romantic Rose Pedicure</title>

<!-- fonts vendored locally -->

<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<link href="../../vendor/fonts-editorial/fonts-editorial.css" rel="stylesheet">

<link href="../../vendor/mini-tw.css" rel="stylesheet">
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../vendor/framer-motion.js"></script>
<script src="../../vendor/babel.min.js"></script>

<style>
  :root{
    --glass-fill:rgba(255, 251, 246, 0.42);
    --glass-stroke:rgba(255, 255, 255, 0.55);
    --glass-shadow: 0 24px 60px -20px rgba(60, 40, 20, 0.22), 0 6px 16px -8px rgba(60, 40, 20, 0.16);


    --fw-cream:#F7ECD8;
    --fw-cream-deep:#F3E3C9;
    --fw-burgundy:#7A2130;
    --fw-burgundy-light:#8C2A3A;
    --fw-gold:#C9A24A;
    --fw-gold-deep:#B8862E;
    --fw-charcoal:#2B221A;
    --fw-charcoal-muted:rgba(43,34,26,0.62);
  }
  html, body{
    width:1080px; height:1920px; margin:0; padding:0;
    background:var(--fw-cream);
    overflow:hidden;
    font-family:'Cormorant Garamond',serif;
    color: var(--fw-charcoal);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root{ width:1080px; height:1920px; position:relative; }
  .glass{
    position:relative;
    background: var(--glass-fill);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--glass-stroke);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.45);
    border-radius: 28px;
    overflow:hidden;
  }
  .glass-strong{
    background: rgba(255, 251, 246, 0.58);
  }
  .glass::after{
    content:""; position:absolute; left:0; right:0; top:0; height:50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
    pointer-events:none;
  }
  .gold-frame{
    position:absolute; inset:0; pointer-events:none;
    border-radius:inherit;
  }


  *{ box-sizing:border-box; }
  body{ cursor:none; color:var(--fw-charcoal); font-family:'Cormorant Garamond',serif; }
  h1,h2,h3,p{ margin:0; }
  .stage{ position:absolute; inset:0; background:radial-gradient(ellipse at 0% 38%,rgba(122,33,48,.14),transparent 52%),radial-gradient(ellipse at 95% 82%,rgba(201,162,74,.24),transparent 55%),linear-gradient(165deg,var(--fw-cream),var(--fw-cream-deep)); }
  .orb{ position:absolute; border-radius:50%; filter:blur(60px); mix-blend-mode:multiply; opacity:.22; pointer-events:none; }
  .orb-1{ width:520px;height:520px;left:-180px;top:220px;background:radial-gradient(circle,var(--fw-burgundy),transparent 65%); }
  .orb-2{ width:600px;height:600px;right:-200px;top:640px;background:radial-gradient(circle,var(--fw-gold),transparent 65%); }
  .orb-3{ width:480px;height:480px;left:60px;bottom:-100px;background:radial-gradient(circle,var(--fw-burgundy-light),transparent 65%);opacity:.12; }
  .content-frame{ position:relative;width:100%;height:100%;padding:36px 44px;display:grid;grid-template-rows:150px 300px 420px 280px 330px 288px;gap:16px; }
  .glass::after{ z-index:0;opacity:.4; }
  .glass > :not(.gold-frame){ position:relative;z-index:1; }
  .caps{ font-family:'Cormorant SC',serif;text-transform:uppercase;letter-spacing:.12em;font-weight:600; }
  .script{ font-family:'Great Vibes',cursive;color:var(--fw-gold-deep);font-weight:400; }
  .header-row{ padding:20px 28px 12px;display:grid;grid-template-columns:1fr 1fr;align-items:center; }
  .wordmark{ font-size:35px;letter-spacing:.12em;white-space:nowrap; }
  .wordmark span{ color:var(--fw-gold-deep); }
  .brand-subline{ font-size:15px;margin-top:5px;letter-spacing:.2em; }
  .collection-lockup{ text-align:right; }
  .collection-badge{ display:inline-block;border:1px solid var(--fw-gold);border-radius:40px;padding:8px 23px;text-align:center;font-size:16px;line-height:1.35;color:var(--fw-burgundy); }
  .collection-badge span{ display:block;font-size:13px; }
  .collection-lockup .script{ font-size:29px;margin-top:6px; }
  .divider-rule{ display:flex;align-items:center;gap:12px;color:var(--fw-gold-deep); }
  .divider-rule:before,.divider-rule:after{ content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--fw-gold)); }
  .divider-rule:after{ transform:rotate(180deg); }
  .header-row .divider-rule{ grid-column:1/-1; }
  .divider-rule svg{ width:20px;height:20px;flex-shrink:0; }
  .headline-panel{ padding:16px 30px;text-align:center;display:flex;flex-direction:column;justify-content:center; }
  h1{ font-size:62px;line-height:.98;font-weight:400; }
  h1 em{ color:var(--fw-burgundy);font-weight:400; }
  .headline-panel .caps{ font-size:18px;margin-top:18px; }
  .intro{ font-size:26px;line-height:1.16;max-width:840px;margin:12px auto 0; }
  .intro span{ color:var(--fw-burgundy);font-weight:600; }
  .choice-panel{ padding:22px 28px; }
  .choice-top{ height:204px;display:flex;align-items:center;justify-content:center; }
  .choice-top .divider-rule{ width:100%;gap:28px; }
  .price-seal{ width:200px;height:200px;flex-shrink:0;border:1.5px solid var(--fw-gold);border-radius:50%;background:var(--fw-cream);color:var(--fw-burgundy);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 5px rgba(247,236,216,.6),0 8px 22px rgba(122,33,48,.08); }
  .price-seal .caps{ font-size:13px; }
  .price-total{ font-size:68px;font-weight:700;line-height:.94;margin:3px 0; }
  .price-inclusions{ font-size:14px;line-height:1.12;width:174px;margin-top:7px; }
  .info-strip{ display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:22px 12px; }
  .info-item{ text-align:center;padding:0 12px; }
  .info-item + .info-item{ border-left:1px solid rgba(201,162,74,.6); }
  .info-item svg{ width:52px;height:52px;margin:0 auto 18px;display:block; }
  .info-item h3{ font-size:21px;color:var(--fw-burgundy);margin-bottom:12px; }
  .info-item p{ font-family:'Jost',sans-serif;font-size:18px;font-style:italic;line-height:1.35; }
  .ritual-panel{ padding:24px 20px; }
  .section-title{ font-size:20px;white-space:nowrap; }
  .steps{ display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px; }
  .step{ text-align:center;position:relative; }
  .step:not(:last-child):after{ content:'›';position:absolute;right:-13px;top:20px;color:var(--fw-gold-deep);font-size:34px; }
  .icon-frame{ position:relative;width:76px;height:76px;border:1px solid var(--fw-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;background:rgba(247,236,216,.6); }
  .icon-frame > svg{ width:44px;height:44px; }
  .step-num{ position:absolute;top:-7px;left:-6px;width:29px;height:29px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--fw-burgundy);border:1px solid var(--fw-gold);color:var(--fw-cream);font:500 16px 'Jost',sans-serif; }
  .step h3{ font-size:22px;line-height:1.02;min-height:46px;font-weight:600;margin-bottom:9px; }
  .step p{ font-family:'Jost',sans-serif;font-size:16px;line-height:1.28; }
  .closing-panel{ padding:14px 18px 12px;display:flex;flex-direction:column; }
  .closing-panel .script{ font-size:31px;text-align:right;margin:6px 12px;line-height:1.2; }
  .footer-bar{ border:1px solid var(--fw-gold);text-align:center;padding:8px 0;font-size:14px;letter-spacing:.13em; }
  .botanical{ position:absolute;width:150px;height:260px;opacity:.16;color:var(--fw-burgundy); }
  .botanical.tl{ left:-64px;top:-50px;transform:rotate(-25deg); }
  .botanical.tr{ right:-66px;top:-40px;transform:scaleX(-1) rotate(-25deg);color:var(--fw-gold-deep); }
  .botanical.bl{ left:-65px;bottom:-35px;transform:rotate(190deg);color:var(--fw-gold-deep); }
  .botanical.br{ right:-65px;bottom:-35px;transform:rotate(160deg); }
  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  .price-panel{ padding:30px 36px;display:flex;flex-direction:column;justify-content:center;gap:26px; }
  .price-layout{ display:grid;grid-template-columns:1fr 270px;gap:28px;align-items:center; }
  .promise{ text-align:center; }
  .promise > .caps{ font-size:19px;color:var(--fw-burgundy); }
  .promise h2{ font-size:50px;font-weight:400;line-height:1.05;margin:16px 0; }
  .promise h2 em{ color:var(--fw-burgundy);font-weight:400; }
  .promise p{ font-family:'Jost',sans-serif;font-size:20px;line-height:1.4;color:var(--fw-charcoal-muted); }
  .price-seal{ width:246px;height:246px;margin:auto; }
  .price-seal .caps{ font-size:21px; }
  .price-total{ font-size:78px; }
  .price-inclusions{ font-family:'Jost',sans-serif;font-size:15px;line-height:1.3;width:190px;margin-top:12px;color:var(--fw-charcoal-muted); }
  .steps{ margin-top:44px;gap:22px; }
  .icon-frame{ width:92px;height:92px;margin-bottom:22px; }
  .icon-frame > svg{ width:50px;height:50px; }
  .step:not(:last-child):after{ right:-17px;top:27px; }
  .step h3{ font-size:22px;line-height:1.15;letter-spacing:.06em;max-width:200px;margin:0 auto; }
  .closing-panel{ padding:24px 24px 18px;justify-content:space-between; }
  .addon-strip{ display:flex;justify-content:center;gap:12px;margin-top:18px; }
  .addon-pill{ border:1px solid var(--fw-gold);border-radius:40px;background:var(--fw-burgundy);color:var(--fw-cream);padding:12px 18px;font-family:'Jost',sans-serif;font-size:18px;white-space:nowrap; }
  .closing-panel .script{ text-align:center;font-size:36px;margin:16px 0; }
  .footer-bar{ font-size:16px;letter-spacing:.08em;padding:12px 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useEffect, useState, useRef, useMemo } = React;
const m = window.Motion.motion;
function App(){
  // staggered spring entry (same as slide 1)
  const springIn = (delay=0)=>({
    initial:{ opacity:0, y:40, scale:0.95 },
    animate:{ opacity:1, y:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const springInLeft = (delay=0)=>({
    initial:{ opacity:0, x:-50, scale:0.95 },
    animate:{ opacity:1, x:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const springInRight = (delay=0)=>({
    initial:{ opacity:0, x:50, scale:0.95 },
    animate:{ opacity:1, x:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const breathe = (phase=0)=>({
    animate:{ y: [0, -2, 0, 2, 0] },
    transition:{ duration:4, repeat:Infinity, ease:'easeInOut', delay: phase }
  });

  // gold border draw (same as slide 1)
  const GoldFrame = ({ r=28, delay=0.4, color="rgba(201,162,74,0.55)" })=> (
    <svg className="gold-frame" viewBox="0 0 100 100" preserveAspectRatio="none">
      <m.rect
        x="0.5" y="0.5" width="99" height="99" rx={r/2.4} ry={r/2.4}
        fill="none" stroke={color} strokeWidth="0.18"
        pathLength="1"
        initial={{ pathLength: 0, opacity: 0 }}
        animate={{ pathLength: 1, opacity: 1 }}
        transition={{ duration: 1.4, delay, ease: 'easeOut' }}
      />
    </svg>
  );


  const benefits = [
    { icon: <AromaIcon/>,    title:'Rose-Champagne Aroma',
      body:'A soft, romantic scent that feels elegant, calming, and feminine.' },
    { icon: <BubbleIcon/>,   title:'Bubbling Volcano Soak',
      body:'A fun, fizzy spa experience that makes the pedicure feel extra special.' },
    { icon: <CollagenIcon/>, title:'Collagen Hydration',
      body:'Helps feet feel softer, smoother, and beautifully refreshed.' },
  ];

  const included = [
    'Rose Volcano Soak',
    'Sugar Scrub Exfoliation',
    'Collagen Cream Mask',
    'Collagen Massage Lotion',
  ];
  const addOns = [
    'Warm Paraffin Wax',
    '10-Min Candle Oil Massage',
    'Steam Therapy',
  ];

  const ritualIcons = [<BubbleIcon/>, <ScrubIcon/>, <JarIcon/>, <LotionIcon/>];
  return <>
    <div className="stage" aria-hidden="true">
      {[1,2,3].map(n=><m.div key={n} className={'orb orb-'+n} animate={{x:[0,25,-15,0],y:[0,-18,12,0]}} transition={{duration:18+n*2,repeat:Infinity,ease:'easeInOut',delay:n*.4}}/>)}
      {['tl','tr','bl','br'].map(c=><BotanicalCorner key={c} corner={c}/>)}
    </div>
    <div className="content-frame">
      <m.div className="glass glass-strong header-row" {...springIn(.05)}>
        <GoldFrame delay={.5}/><HeaderRow/><DividerRule/>
      </m.div>
      <m.div className="glass glass-strong headline-panel" {...springIn(.15)}>
        <GoldFrame delay={.7}/>
        <h1>Romantic <em>Rose</em><br/>Pedicure</h1>
        <p className="caps">Deluxe Pedicure · Romantic Treatment</p>
        <p className="intro">Indulge in romance. Leave with radiance.</p>
      </m.div>
      <m.div className="glass glass-strong price-panel" {...springIn(.25)}>
        <GoldFrame delay={.85}/><DividerRule/>
        <div className="price-layout">
          <m.div className="promise" {...springInLeft(.35)}><m.div {...breathe(.1)}>
            <div className="caps">The Promise</div>
            <h2>Soft. Fizzy. <em>Radiant.</em></h2>
            <p>Rose-champagne soak · collagen hydration</p>
          </m.div></m.div>
          <m.div {...springInRight(.4)}><PriceSeal/></m.div>
        </div>
        <DividerRule/>
      </m.div>
      <m.div className="glass info-strip" {...springIn(.65)}>
        <GoldFrame delay={1}/>
        {benefits.map(b=><InfoItem key={b.title} {...b}/>)}
      </m.div>
      <m.div className="glass glass-strong ritual-panel" {...springIn(.85)}>
        <GoldFrame delay={1.3}/><DividerRule><h2 className="caps section-title">What's Included</h2></DividerRule>
        <div className="steps">{included.map((title,i)=><m.div className="step" key={title} initial={{opacity:0,y:18}} animate={{opacity:1,y:0}} transition={{delay:.85+i*.08,duration:.55,ease:'easeOut'}}>
          <div className="icon-frame"><m.span className="step-num" initial={{scale:0,opacity:0}} animate={{scale:1,opacity:1}} transition={{delay:.92+i*.08,type:'spring',stiffness:260,damping:14}}>{i+1}</m.span>{ritualIcons[i]}</div>
          <h3 className="caps">{title}</h3>
        </m.div>)}</div>
      </m.div>
      <m.div className="glass glass-strong closing-panel" {...springIn(1.15)}>
        <GoldFrame delay={1.6}/>
        <div><DividerRule><h2 className="caps section-title">+ Optional Add-Ons</h2></DividerRule>
          <div className="addon-strip">{addOns.map(item=><span className="addon-pill" key={item}>{item}</span>)}</div>
        </div>
        <p className="script">Indulge in romance. Leave with radiance.</p>
        <FooterBar/>
      </m.div>
    </div>
  </>;
}

function HeaderRow(){return <>
  <div><div className="caps wordmark" aria-label="DELUXE NAIL SPA">DELU<span>X</span>E NAIL SPA</div><div className="caps brand-subline">BEAUTY · CARE · RELAXATION</div></div>
  <div className="collection-lockup"><div className="caps collection-badge">New · Intro Offer<span>Deluxe Pedicure · Romantic Treatment</span></div></div>
</>;}
function PriceSeal(){return <div className="price-seal"><div className="caps">From</div><div className="price-total">$75</div><div className="price-inclusions">Gel polish &amp; add-ons available</div></div>;}
function InfoItem({icon,title,body}){return <div className="info-item">{icon}<h3 className="caps">{title}</h3><p>{body}</p></div>;}
function FooterBar(){return <div className="caps footer-bar">Treat yourself · Ask the front desk about the intro offer</div>;}
function DividerRule({children}){return <div className="divider-rule"><LeafIcon/>{children}{children && <LeafIcon/>}</div>;}
function LeafIcon(){return <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20Q2 3 21 3Q21 21 4 20ZM4 20L16 8" stroke="currentColor" strokeWidth="1.4" fill="rgba(201,162,74,.12)"/></svg>;}
function BotanicalCorner({corner}){return <svg className={'botanical '+corner} viewBox="0 0 150 260" fill="none"><path d="M70 250Q110 125 55 10" stroke="currentColor" strokeWidth="2"/>{[0,1,2,3,4].map(n=><g key={n} transform={'translate(0 '+n*43+')'}><path d="M77 48Q12 35 34 3Q75 14 77 48ZM80 58Q135 40 121 13Q87 23 80 58Z" fill="currentColor"/></g>)}</svg>;}
function ScrubIcon(){
  return (
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <path d="M8 22 L 12 12 H 24 L 28 22 Z" stroke="var(--fw-charcoal)" strokeWidth="1.6" strokeLinejoin="round" fill="rgba(201,162,74,0.20)"/>
      <line x1="8" y1="22" x2="28" y2="22" stroke="var(--fw-charcoal)" strokeWidth="1.6"/>
      <circle cx="14" cy="17" r="1.1" fill="var(--fw-gold-deep)"/>
      <circle cx="18" cy="15" r="1.1" fill="var(--fw-gold-deep)"/>
      <circle cx="22" cy="18" r="1.1" fill="var(--fw-gold-deep)"/>
      <circle cx="16" cy="20" r="0.9" fill="var(--fw-gold-deep)"/>
      <circle cx="21" cy="20" r="0.9" fill="var(--fw-gold-deep)"/>
      <path d="M11 26 H 25" stroke="var(--fw-gold-deep)" strokeWidth="1.5" strokeLinecap="round"/>
    </svg>
  );
}
function JarIcon(){
  return (
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <rect x="10" y="8" width="16" height="4" rx="1.2" stroke="var(--fw-charcoal)" strokeWidth="1.6" fill="rgba(201,162,74,0.30)"/>
      <path d="M11 12 H 25 V 27 C 25 28.5, 23.5 29, 22 29 H 14 C 12.5 29, 11 28.5, 11 27 Z"
        stroke="var(--fw-charcoal)" strokeWidth="1.6" strokeLinejoin="round" fill="rgba(201,162,74,0.18)"/>
      <path d="M14 18 C 16 16, 20 16, 22 18" stroke="var(--fw-gold-deep)" strokeWidth="1.4" strokeLinecap="round" fill="none"/>
      <path d="M13 22 C 16 20, 20 20, 23 22" stroke="var(--fw-gold-deep)" strokeWidth="1.4" strokeLinecap="round" fill="none"/>
    </svg>
  );
}
function LotionIcon(){
  return (
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <path d="M15 8 H 21 V 11 H 15 Z" stroke="var(--fw-charcoal)" strokeWidth="1.6" fill="rgba(201,162,74,0.30)"/>
      <path d="M13 11 H 23 L 22 14 H 14 Z" stroke="var(--fw-charcoal)" strokeWidth="1.6" strokeLinejoin="round" fill="rgba(201,162,74,0.18)"/>
      <path d="M14 14 H 22 V 28 C 22 29, 21 29.5, 20 29.5 H 16 C 15 29.5, 14 29, 14 28 Z"
        stroke="var(--fw-charcoal)" strokeWidth="1.6" strokeLinejoin="round" fill="rgba(201,162,74,0.15)"/>
      <path d="M21 8 V 5 H 24 V 7" stroke="var(--fw-gold-deep)" strokeWidth="1.5" strokeLinecap="round" fill="none"/>
      <line x1="16" y1="20" x2="20" y2="20" stroke="var(--fw-gold-deep)" strokeWidth="1.4" strokeLinecap="round"/>
      <line x1="16" y1="23" x2="20" y2="23" stroke="var(--fw-gold-deep)" strokeWidth="1.4" strokeLinecap="round"/>
    </svg>
  );
}
function AromaIcon(){
  return (
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
      {/* rose bloom */}
      <path d="M16 13 C 12.5 16, 12 21, 16 25 C 20 21, 19.5 16, 16 13 Z"
        stroke="var(--fw-burgundy)" strokeWidth="1.5" strokeLinejoin="round" fill="rgba(122,33,48,0.30)"/>
      <path d="M8 20 C 10 16, 13.5 17, 16 25 C 13 26.5, 9.5 25, 8 20 Z"
        stroke="var(--fw-burgundy)" strokeWidth="1.4" strokeLinejoin="round" fill="rgba(122,33,48,0.18)"/>
      <path d="M24 20 C 22 16, 18.5 17, 16 25 C 19 26.5, 22.5 25, 24 20 Z"
        stroke="var(--fw-burgundy)" strokeWidth="1.4" strokeLinejoin="round" fill="rgba(122,33,48,0.18)"/>
      {/* aroma wisps */}
      <path d="M13 9 C 13 7, 15 7, 15 5 C 15 3, 13 3, 13 1.5" stroke="var(--fw-gold-deep)" strokeWidth="1.4" strokeLinecap="round" fill="none"/>
      <path d="M19 9 C 19 7, 17 7, 17 5 C 17 3, 19 3, 19 1.5" stroke="var(--fw-gold-deep)" strokeWidth="1.4" strokeLinecap="round" fill="none"/>
    </svg>
  );
}
function BubbleIcon(){
  return (
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
      {/* bowl */}
      <path d="M5 17 H 27 C 26 25, 21.5 29, 16 29 C 10.5 29, 6 25, 5 17 Z"
        stroke="var(--fw-burgundy)" strokeWidth="1.6" strokeLinejoin="round" fill="rgba(122,33,48,0.22)"/>
      <ellipse cx="16" cy="17" rx="11" ry="2" stroke="var(--fw-burgundy)" strokeWidth="1.5" fill="rgba(122,33,48,0.30)"/>
      {/* fizzing bubbles */}
      <circle cx="13" cy="12" r="2.4" stroke="var(--fw-gold-deep)" strokeWidth="1.3" fill="rgba(201,162,74,0.50)"/>
      <circle cx="19" cy="9" r="1.8" stroke="var(--fw-gold-deep)" strokeWidth="1.2" fill="rgba(201,162,74,0.50)"/>
      <circle cx="16" cy="6" r="1.3" stroke="var(--fw-gold-deep)" strokeWidth="1.1" fill="rgba(201,162,74,0.45)"/>
      <circle cx="22" cy="13" r="1.4" stroke="var(--fw-gold-deep)" strokeWidth="1.1" fill="rgba(201,162,74,0.45)"/>
    </svg>
  );
}
