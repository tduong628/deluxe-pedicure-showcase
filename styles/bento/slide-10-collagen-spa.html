<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>Deluxe Nail Spa — Collagen Spa Experience</title>

<!-- fonts vendored locally -->

<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<link href="../../vendor/fonts-editorial/fonts-editorial.css" rel="stylesheet">

<link href="../../vendor/mini-tw.css" rel="stylesheet">
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../vendor/framer-motion.js"></script>
<script src="../../vendor/babel.min.js"></script>

<style>
  img[src*="assets/icons/"]{ border-radius:50%; display:block; }

  :root{
    --cream-100:#F5E6D8;
    --cream-200:#E8D5C4;
    --cream-300:#D4B8A0;
    --blush:#E8C4B4;
    --sage:#B5C4A8;
    --gold:#B8965A;
    --gold-hi:#D4B886;
    --champagne:#C9A961;
    --jade:#9DB5A6;
    --jade-deep:#7E9A8B;
    --charcoal:#1F1B16;
    --charcoal-soft:rgba(31,27,22,0.78);
    --charcoal-muted:rgba(31,27,22,0.55);
    --glass-fill:rgba(255, 251, 246, 0.42);
    --glass-stroke:rgba(255, 255, 255, 0.55);
    --glass-shadow: 0 24px 60px -20px rgba(60, 40, 20, 0.22), 0 6px 16px -8px rgba(60, 40, 20, 0.16);

    --fw-cream:#F7ECD8;
    --fw-cream-deep:#F3E3C9;
    --fw-burgundy:#7A2130;
    --fw-burgundy-light:#8C2A3A;
    --fw-gold:#C9A24A;
    --fw-gold-deep:#B8862E;
    --fw-charcoal:#2B221A;
    --fw-charcoal-muted:rgba(43,34,26,0.62);
  }
  *{ box-sizing:border-box; }
  html, body{
    width:1080px; height:1920px; margin:0; padding:0;
    overflow:hidden;
    cursor:none;
    background:var(--fw-cream);
    color:var(--fw-charcoal);
    font-family:'Cormorant Garamond',serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root{ width:1080px; height:1920px; position:relative; }
  h1,h2,h3,p{ margin:0; }

  .stage{ position:absolute; inset:0; background:radial-gradient(ellipse at 0% 38%,rgba(122,33,48,.14),transparent 52%),radial-gradient(ellipse at 95% 82%,rgba(157,181,166,.22),transparent 55%),linear-gradient(165deg,var(--fw-cream),var(--fw-cream-deep)); }
  .orb{ position:absolute; border-radius:50%; filter:blur(60px); mix-blend-mode:multiply; opacity:.22; pointer-events:none; }
  .orb-1{ width:520px;height:520px;left:-180px;top:220px;background:radial-gradient(circle,var(--fw-burgundy),transparent 65%); }
  .orb-2{ width:600px;height:600px;right:-200px;top:640px;background:radial-gradient(circle,var(--fw-gold),transparent 65%); }
  .orb-3{ width:480px;height:480px;left:60px;bottom:-100px;background:radial-gradient(circle,var(--jade),transparent 65%);opacity:.16; }

  .glass{ position:relative;background:var(--glass-fill);-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%);border:1px solid var(--glass-stroke);box-shadow:var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.45);border-radius:28px;overflow:hidden; }
  .glass-strong{ background:rgba(247,236,216,.92);border-color:rgba(201,162,74,.4);backdrop-filter:none;-webkit-backdrop-filter:none; }
  .glass::after{ content:'';position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,0.35),rgba(255,255,255,0));pointer-events:none;z-index:0;opacity:.4; }
  .glass > :not(.gold-frame){ position:relative;z-index:1; }
  .gold-frame{ position:absolute;inset:0;pointer-events:none;border-radius:inherit; }

  .caps{ font-family:'Cormorant SC',serif;text-transform:uppercase;letter-spacing:.12em;font-weight:600; }
  .script{ font-family:'Great Vibes',cursive;color:var(--fw-gold-deep);font-weight:400; }

  .content-frame{ position:relative;width:100%;height:100%;padding:36px 44px;display:grid;grid-template-rows:135px 470px 285px 260px 350px 155px 97px;gap:16px; }
  /* Rows 135+470+285+260+350+155+97=1752 + 6*16 gap + 2*36 padding = 1920. */
  .hero-img{width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block;}
  .hero-fallback{position:absolute;inset:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 25%,var(--fw-cream),transparent 65%),linear-gradient(170deg,var(--fw-gold),var(--fw-burgundy),var(--fw-charcoal));}
  .hero-vignette{position:absolute!important;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(43,34,26,.08) 20%,rgba(43,34,26,.18) 40%,rgba(43,34,26,.88) 100%),linear-gradient(90deg,rgba(43,34,26,.22),transparent 70%);}
  .hero-eyebrow-pill{position:absolute!important;z-index:1;top:28px;left:30px;padding:10px 18px;display:flex;align-items:center;gap:10px;border-radius:40px;background:rgba(247,236,216,.94);border:1px solid rgba(201,162,74,.65);color:var(--fw-burgundy);font-size:14px;}
  .hero-eyebrow-pill:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--fw-burgundy);}
  .hero-copy{position:absolute!important;z-index:1;left:40px;right:40px;bottom:38px;color:var(--fw-cream);text-shadow:0 2px 14px rgba(43,34,26,.4);}
  .hero-copy h1{font-size:70px;line-height:.98;font-weight:400;}
  .hero-copy h1 em{color:var(--fw-gold);font-style:italic;font-weight:400;}
  .hero-standfirst{font-size:22px;font-style:normal;font-family:'Jost',sans-serif;margin-top:14px;line-height:1.4;max-width:760px;}
  .experience-panel .ribbon-label{margin-top:0;}

  .header-row{ padding:20px 28px 12px;display:grid;grid-template-columns:1fr 1fr;align-items:center; }
  .wordmark{ font-size:35px;letter-spacing:.12em;white-space:nowrap; }
  .wordmark span{ color:var(--fw-gold-deep); }
  .brand-subline{ font-size:15px;margin-top:5px;letter-spacing:.2em; }
  .collection-lockup{ text-align:right; }
  .collection-badge{ display:inline-block;border:1px solid var(--fw-gold);border-radius:40px;padding:12px 22px;text-align:center;font-size:16px;line-height:1.35;color:var(--fw-burgundy);max-width:360px; }
  .divider-rule{ display:flex;align-items:center;gap:12px;color:var(--fw-gold-deep); }
  .divider-rule:before,.divider-rule:after{ content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--fw-gold)); }
  .divider-rule:after{ transform:rotate(180deg); }
  .header-row .divider-rule{ grid-column:1/-1; }
  .divider-rule svg{ width:20px;height:20px;flex-shrink:0; }
  .section-title{ font-size:20px;white-space:nowrap; }

  .headline-panel{ padding:24px 40px;text-align:center;display:flex;flex-direction:column;justify-content:center; }
  h1{ font-size:74px;line-height:1;font-weight:400; }
  h1 em{ color:var(--fw-burgundy);font-weight:400; }
  .intro{ font-family:'Jost',sans-serif;font-size:23px;line-height:1.4;max-width:820px;margin:18px auto 0; }

  .experience-panel{ padding:24px 36px;display:grid;grid-template-columns:1fr 240px;align-items:center;gap:32px; }
  .experience-art{ display:flex;align-items:center;gap:28px; }
  .collagen-art{ width:170px;height:170px;flex-shrink:0;border:1px solid var(--fw-gold);border-radius:85px 85px 24px 24px;background:radial-gradient(ellipse at 50% 35%,#fff9e9,transparent 65%),linear-gradient(135deg,#c9d8cf,var(--fw-cream-deep),#cba260);display:flex;align-items:center;justify-content:center; }
  .collagen-art svg{ width:130px;height:130px; }
  .ribbon-label{ display:inline-block;border-radius:40px;background:var(--fw-burgundy);color:var(--fw-cream);font-size:17px;padding:7px 20px;font-weight:600; }
  .promise{ font-size:38px;line-height:1.08;font-weight:400;margin-top:14px; }
  .promise em{ color:var(--fw-burgundy); }
  .secondary{ font-family:'Jost',sans-serif;font-size:18px;line-height:1.42;margin-top:14px;max-width:480px; }

  .price-seal{ width:234px;height:234px;flex-shrink:0;border:1.5px solid var(--fw-gold);border-radius:50%;background:var(--fw-cream);color:var(--fw-burgundy);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 5px rgba(247,236,216,.6),0 8px 22px rgba(122,33,48,.08); }
  .price-seal .caps{ font-size:14px; }
  .price-total{ font-size:49px;font-weight:700;line-height:.94;margin:9px 0;white-space:nowrap; }
  .price-inclusions{ font-family:'Jost',sans-serif;font-size:16px;line-height:1.32;width:180px; }

  .benefits-panel{ padding:22px 30px;display:flex;flex-direction:column; }
  .bullets-grid{ display:grid;grid-template-columns:1.05fr 1fr;column-gap:40px;row-gap:14px;margin-top:20px;flex:1;align-content:center; }
  .bullet-item{ display:flex;align-items:center;gap:14px; }
  .leaf-bullet{ width:32px;height:32px;flex-shrink:0;border-radius:50%;border:1px solid var(--fw-gold);background:rgba(247,236,216,.7);display:flex;align-items:center;justify-content:center; }
  .leaf-bullet svg{ width:16px;height:16px; }
  .bullet-item p{ font-family:'Jost',sans-serif;font-size:19px;line-height:1.24;color:var(--fw-charcoal); }

  .ritual-panel{ padding:26px 26px; }
  .steps{ display:grid;grid-template-columns:repeat(5,1fr);column-gap:16px;row-gap:20px;margin-top:26px; }
  .step{ text-align:center;position:relative; }
  .step:not(:last-child):after{ content:'›';position:absolute;right:-11px;top:16px;color:var(--fw-gold-deep);font-size:28px; }
  .icon-frame{ position:relative;width:72px;height:72px;border:1px solid var(--fw-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;background:rgba(247,236,216,.6); }
  .icon-frame > svg{ width:38px;height:38px; }
  .step-num{ position:absolute;top:-6px;left:-4px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--fw-burgundy);border:1px solid var(--fw-gold);color:var(--fw-cream);font:500 14px 'Jost',sans-serif; }
  .step h3{ font-size:19px;line-height:1.08;min-height:44px;font-weight:600;margin-bottom:8px; }
  .step p{ font-family:'Jost',sans-serif;font-size:13px;line-height:1.28; }

  .also-included-panel{ padding:20px 30px;display:flex;flex-direction:column;justify-content:center; }
  .also-strip{ display:grid;grid-template-columns:repeat(4,1fr);align-items:center;margin-top:14px; }
  .also-item{ text-align:center;padding:0 10px; }
  .also-item + .also-item{ border-left:1px solid rgba(201,162,74,.5); }
  .also-item .icon-frame{ width:52px;height:52px;margin-bottom:9px;border-width:1px; }
  .also-item .icon-frame > svg{ width:26px;height:26px; }
  .also-item p{ font-size:16px;color:var(--fw-burgundy); }

  .closing-panel{ padding:14px 18px;display:flex;flex-direction:column;justify-content:center; }
  .footer-bar{ border:1px solid var(--fw-gold);text-align:center;padding:14px 0;font-size:20px;letter-spacing:.13em; }

  .botanical{ position:absolute;width:150px;height:260px;opacity:.16;color:var(--fw-burgundy); }
  .botanical.tl{ left:-64px;top:-50px;transform:rotate(-25deg); }
  .botanical.tr{ right:-66px;top:-40px;transform:scaleX(-1) rotate(-25deg);color:var(--fw-gold-deep); }
  .botanical.bl{ left:-65px;bottom:-35px;transform:rotate(190deg);color:var(--fw-gold-deep); }
  .botanical.br{ right:-65px;bottom:-35px;transform:rotate(160deg); }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useEffect, useState, useRef, useMemo } = React;
const m = window.Motion.motion;
function App(){
  const springIn = (delay=0)=>({
    initial:{ opacity:0, y:40, scale:0.95 },
    animate:{ opacity:1, y:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const springInLeft = (delay=0)=>({
    initial:{ opacity:0, x:-50, scale:0.95 },
    animate:{ opacity:1, x:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const springInRight = (delay=0)=>({
    initial:{ opacity:0, x:50, scale:0.95 },
    animate:{ opacity:1, x:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const breathe = (phase=0)=>({
    animate:{ y: [0, -2, 0, 2, 0] },
    transition:{ duration:4, repeat:Infinity, ease:'easeInOut', delay: phase }
  });

  const GoldFrame = ({ r=28, delay=0.4, color="rgba(201,162,74,0.55)" })=> (
    <svg className="gold-frame" viewBox="0 0 100 100" preserveAspectRatio="none">
      <m.rect
        x="0.5" y="0.5" width="99" height="99" rx={r/2.4} ry={r/2.4}
        fill="none" stroke={color} strokeWidth="0.18"
        pathLength="1"
        initial={{ pathLength: 0, opacity: 0 }}
        animate={{ pathLength: 1, opacity: 1 }}
        transition={{ duration: 1.4, delay, ease: 'easeOut' }}
      />
    </svg>
  );

  const bullets = [
    'Deeply hydrates and softens dry skin',
    'Helps improve skin texture and smoothness',
    'Refreshes tired feet with cooling relief',
    'Nourishes nails and cuticles',
    'Leaves skin feeling silky, healthy, and renewed',
  ];

  const steps = [
    { title:'Collagen Crystal Soak',   body:'A crystal-infused soak to begin the ritual.',        icon:<img src="assets/icons/icon-pearl-mineral.png" alt="Collagen crystal soak" style={{width:'100%',height:'100%',objectFit:'contain'}}/> },
    { title:'Sugar Cane Scrub',        body:'Natural sugar cane buffs away rough, dry skin.',     icon:<img src="assets/icons/icon-sugar-scrub.png" alt="Sugar cane scrub" style={{width:'100%',height:'100%',objectFit:'contain'}}/> },
    { title:'Collagen Cream Mask',     body:'A nourishing collagen mask for the feet.',           icon:<img src="assets/icons/icon-cream-mask.png" alt="Collagen cream mask" style={{width:'100%',height:'100%',objectFit:'contain'}}/> },
    { title:'Muscle-Relaxing Gel',     body:'A soothing gel to ease tired leg muscles.',          icon:<img src="assets/icons/icon-calm-relief.png" alt="Muscle-relaxing gel" style={{width:'100%',height:'100%',objectFit:'contain'}}/> },
    { title:'Collagen Massage Lotion', body:'A relaxing massage with collagen-infused lotion.',   icon:<img src="assets/icons/icon-lotion-massage.png" alt="Collagen massage lotion" style={{width:'100%',height:'100%',objectFit:'contain'}}/> },
  ];

  const addOns = [
    { title:'Steam Therapy',              icon:<img src="assets/icons/icon-steam-therapy.png" alt="Steam therapy" style={{width:'100%',height:'100%',objectFit:'contain'}}/> },
    { title:'Collagen Socks',             icon:<img src="assets/icons/icon-towel-finish.png" alt="Collagen socks" style={{width:'100%',height:'100%',objectFit:'contain'}}/> },
    { title:'Cooling Gel Finish',         icon:<img src="assets/icons/icon-hydration-droplet.png" alt="Cooling gel finish" style={{width:'100%',height:'100%',objectFit:'contain'}}/> },
    { title:'10-Min Hot Stone Massage',   icon:<img src="assets/icons/icon-hot-stone.png" alt="Ten minute hot stone massage" style={{width:'100%',height:'100%',objectFit:'contain'}}/> },
  ];

  return <>
    <div className="stage" aria-hidden="true">
      {[1,2,3].map((n)=><m.div key={n} className={'orb orb-'+n} animate={{x:[0,25,-15,0],y:[0,-18,12,0]}} transition={{duration:18+n*2,repeat:Infinity,ease:'easeInOut',delay:n*.4}}/>)}
      {['tl','tr','bl','br'].map(c=><BotanicalCorner key={c} corner={c}/>)}
    </div>
    <div className="content-frame">
      <m.div className="glass glass-strong header-row" {...springIn(.05)}>
        <GoldFrame delay={.5}/><HeaderRow/><DividerRule/>
      </m.div>

      <m.div className="glass hero" {...springIn(.15)}>
        <m.div style={{width:'100%',height:'100%'}} initial={{scale:.95}} animate={{scale:[1,1.015,1]}} transition={{scale:{duration:5,repeat:Infinity,ease:'easeInOut'},opacity:{duration:1.4}}}>
          <img src="assets/collagen-spa-hero.png" alt="A bowl of jade-green collagen cream swirled smooth and garnished with a white orchid blossom, beside spa stones and bamboo leaves"
            className="hero-img"
            onError={(e)=>{ e.currentTarget.style.display='none'; e.currentTarget.parentElement.insertAdjacentHTML('beforeend', '<div class=\"hero-fallback\"></div>'); }}/>
        </m.div>
        <div className="hero-vignette"/>
        <m.div className="caps hero-eyebrow-pill" initial={{opacity:0,y:-10}} animate={{opacity:1,y:0}} transition={{delay:.95,duration:.6}}>Deluxe Pedicure · Signature Restoring Treatment</m.div>
        <m.div className="hero-copy" initial={{opacity:0,y:24}} animate={{opacity:1,y:0}} transition={{delay:1,duration:.7,ease:'easeOut'}}>
          <h1><em>Collagen</em> Spa Experience</h1>
          <p className="hero-standfirst">Revive. Replenish. Radiate.</p>
        </m.div><GoldFrame delay={.7}/>
      </m.div>

      <m.div className="glass glass-strong experience-panel" {...springIn(.25)}>
        <GoldFrame delay={.85}/>
        <m.div {...springInLeft(.35)}><m.div {...breathe(.1)}>
          <p className="ribbon-label">The Collagen <em>Difference</em></p>
          <p className="secondary">A restoring spa pedicure that softens dry skin, replenishes moisture, and leaves feet smooth, refreshed, and radiant.</p>
        </m.div></m.div>
        <m.div {...springInRight(.4)}><PriceSeal/></m.div>
      </m.div>

      <m.div className="glass glass-strong benefits-panel" {...springIn(.55)}>
        <GoldFrame delay={.95}/><DividerRule><h2 className="caps section-title">Why You'll Love It</h2></DividerRule>
        <div className="bullets-grid">
          {bullets.map((b,i)=>{
            const col = i<3 ? 1 : 2;
            const row = i<3 ? i+1 : i-2;
            return <m.div className="bullet-item" key={b} style={{gridColumn:col,gridRow:row}} initial={{opacity:0,x:-12}} animate={{opacity:1,x:0}} transition={{delay:.6+i*.06,duration:.45,ease:'easeOut'}}>
              <span className="leaf-bullet"><img src="assets/icons/icon-botanical-leaf-green.png" alt="Benefit" style={{width:'100%',height:'100%',objectFit:'contain'}}/></span><p>{b}</p>
            </m.div>;
          })}
        </div>
      </m.div>

      <m.div className="glass glass-strong ritual-panel" {...springIn(.85)}>
        <GoldFrame delay={1.3}/><DividerRule><h2 className="caps section-title">The Five-Step Collagen Ritual</h2></DividerRule>
        <div className="steps">{steps.map((s,i)=><m.div className="step" key={s.title} initial={{opacity:0,y:18}} animate={{opacity:1,y:0}} transition={{delay:.85+i*.08,duration:.55,ease:'easeOut'}}>
          <div className="icon-frame"><m.span className="step-num" initial={{scale:0,opacity:0}} animate={{scale:1,opacity:1}} transition={{delay:.92+i*.08,type:'spring',stiffness:260,damping:14}}>{i+1}</m.span>{s.icon}</div><h3>{s.title}</h3><p>{s.body}</p>
        </m.div>)}</div>
      </m.div>

      <m.div className="glass glass-strong also-included-panel" {...springIn(1.15)}>
        <GoldFrame delay={1.5}/><DividerRule><h2 className="caps section-title">Also Included</h2></DividerRule>
        <div className="also-strip">{addOns.map((a,i)=><m.div className="also-item" key={a.title} initial={{opacity:0,x:-10}} animate={{opacity:1,x:0}} transition={{delay:1.2+i*.06,duration:.4,ease:'easeOut'}}>
          <div className="icon-frame">{a.icon}</div><p className="caps">{a.title}</p>
        </m.div>)}</div>
      </m.div>

      <m.div className="glass glass-strong closing-panel" {...springIn(1.45)}>
        <GoldFrame delay={1.75}/><FooterBar/>
      </m.div>
    </div>
  </>;
}

function HeaderRow(){return <>
  <div><div className="caps wordmark" aria-label="DELUXE NAIL SPA">DELU<span>X</span>E NAIL SPA</div><div className="caps brand-subline">BEAUTY · CARE · RELAXATION</div></div>
  <div className="collection-lockup"><div className="caps collection-badge">Signature Restoring Treatment</div><p className="caps brand-subline">Cary, NC</p></div>
</>;}
function PriceSeal(){return <div className="price-seal"><div className="caps">Spa Pedicure</div><div className="price-total">From $85</div><p className="price-inclusions">{'Gel polish & add-ons available'}</p></div>;}
function FooterBar(){return <div className="caps footer-bar">The radiant finish you deserve</div>;}
function DividerRule({children}){return <div className="divider-rule"><LeafIcon/>{children}{children && <LeafIcon/>}</div>;}
function LeafIcon(){return <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20Q2 3 21 3Q21 21 4 20ZM4 20L16 8" stroke="var(--fw-burgundy)" strokeWidth="1.4" fill="rgba(201,162,74,.12)"/></svg>;}
function BotanicalCorner({corner}){return <svg className={'botanical '+corner} viewBox="0 0 150 260" fill="none"><path d="M70 250Q110 125 55 10" stroke="currentColor" strokeWidth="2"/>{[0,1,2,3,4].map(n=><g key={n} transform={'translate(0 '+n*43+')'}><path d="M77 48Q12 35 34 3Q75 14 77 48ZM80 58Q135 40 121 13Q87 23 80 58Z" fill="currentColor"/></g>)}</svg>;}

function CollagenArt(){return <svg viewBox="0 0 100 100" fill="none">
  <ellipse cx="50" cy="58" rx="36" ry="14" stroke="var(--fw-burgundy)" strokeWidth="1.2" fill="rgba(157,181,166,0.30)"/>
  <path d="M20 58Q30 30 50 30Q70 30 80 58" stroke="var(--fw-gold-deep)" strokeWidth="1.2" fill="none"/>
  <ellipse cx="50" cy="26" rx="7" ry="11" stroke="var(--fw-gold-deep)" strokeWidth="1" fill="rgba(244,236,221,0.6)"/>
  <path d="M50 37V52" stroke="var(--fw-gold-deep)" strokeWidth="1"/>
</svg>;}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
