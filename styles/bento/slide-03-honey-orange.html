<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>Deluxe Nail Spa — Honey Orange Zest Spa Pedicure</title>

<!-- fonts vendored locally -->

<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<link href="../../vendor/fonts-editorial/fonts-editorial.css" rel="stylesheet">

<link href="../../vendor/mini-tw.css" rel="stylesheet">
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>

<style>
  :root{
    --cream-100:#F5E6D8;
    --cream-200:#E8D5C4;
    --cream-300:#D4B8A0;
    --blush:#E8C4B4;
    --sage:#B5C4A8;
    --gold:#B8965A;
    --gold-hi:#D4B886;
    --charcoal:#1F1B16;
    --charcoal-soft:rgba(31,27,22,0.78);
    --charcoal-muted:rgba(31,27,22,0.55);
    --glass-fill:rgba(255, 251, 246, 0.42);
    --glass-stroke:rgba(255, 255, 255, 0.55);
    --glass-shadow: 0 24px 60px -20px rgba(60, 40, 20, 0.22), 0 6px 16px -8px rgba(60, 40, 20, 0.16);

    --fw-cream:#F7ECD8;
    --fw-cream-deep:#F3E3C9;
    --fw-burgundy:#7A2130;
    --fw-burgundy-light:#8C2A3A;
    --fw-gold:#C9A24A;
    --fw-gold-deep:#B8862E;
    --fw-charcoal:#2B221A;
    --fw-charcoal-muted:rgba(43,34,26,0.62);
  }
  html, body{
    width:1080px; height:1920px; margin:0; padding:0;
    background:var(--fw-cream);
    overflow:hidden;
    font-family: 'Cormorant Garamond', serif;
    color: var(--fw-charcoal);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    cursor:none;
  }
  *{ box-sizing:border-box; }
  h1,h2,h3,p{ margin:0; }
  #root{ width:1080px; height:1920px; position:relative; }
  .glass{
    position:relative;
    background: var(--glass-fill);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--glass-stroke);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.45);
    border-radius: 28px;
    overflow:hidden;
  }
  .glass-strong{
    background: rgba(255, 251, 246, 0.58);
  }
  .glass::after{
    content:""; position:absolute; left:0; right:0; top:0; height:50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
    pointer-events:none; z-index:0; opacity:.4;
  }
  .glass > :not(.gold-frame){ position:relative; z-index:1; }
  .gold-frame{
    position:absolute; inset:0; pointer-events:none;
    border-radius:inherit;
  }

  .caps{ font-family:'Cormorant SC',serif; text-transform:uppercase; letter-spacing:.13em; font-weight:600; }

  .stage{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 4% 36%, rgba(122,33,48,.14), transparent 52%),
      radial-gradient(ellipse at 96% 82%, rgba(201,162,74,.24), transparent 55%),
      linear-gradient(165deg, var(--fw-cream), var(--fw-cream-deep));
  }
  .orb{ position:absolute; border-radius:50%; filter:blur(60px); mix-blend-mode:multiply; opacity:.20; pointer-events:none; }
  .orb-1{ width:520px; height:520px; left:-180px; top:200px; background:radial-gradient(circle, var(--fw-burgundy), transparent 65%); }
  .orb-2{ width:600px; height:600px; right:-200px; top:640px; background:radial-gradient(circle, var(--fw-gold), transparent 65%); }
  .orb-3{ width:480px; height:480px; left:60px; bottom:-100px; background:radial-gradient(circle, var(--fw-burgundy-light), transparent 65%); opacity:.12; }

  .botanical{ position:absolute; width:150px; height:260px; opacity:.16; color:var(--fw-burgundy); pointer-events:none; }
  .botanical.tl{ left:-64px; top:-50px; transform:rotate(-25deg); }
  .botanical.tr{ right:-66px; top:-40px; transform:scaleX(-1) rotate(-25deg); color:var(--fw-gold-deep); }
  .botanical.bl{ left:-65px; bottom:-35px; transform:rotate(190deg); color:var(--fw-gold-deep); }
  .botanical.br{ right:-65px; bottom:-35px; transform:rotate(160deg); }

  .content-frame{ position:relative; width:100%; height:100%; padding:36px 44px; display:grid;
    grid-template-rows: 140px 700px 230px 300px 300px 88px; gap:18px; }

  .header-row{ padding:20px 28px 12px; display:grid; grid-template-columns:1fr auto; align-items:center; }
  .panel-content{ position:relative; z-index:1; }
  .wordmark{ font-size:35px; letter-spacing:.12em; white-space:nowrap; }
  .wordmark span{ color:var(--fw-gold-deep); }
  .brand-subline{ font-size:15px; margin-top:5px; letter-spacing:.2em; }
  .collection-lockup{ text-align:right; }
  .collection-badge{ display:inline-block; border:1px solid var(--fw-gold); border-radius:40px; padding:9px 24px; text-align:center; font-size:15px; line-height:1.3; color:var(--fw-burgundy); white-space:nowrap; }
  .divider-rule{ display:flex; align-items:center; gap:12px; color:var(--fw-gold-deep); }
  .divider-rule:before,.divider-rule:after{ content:''; height:1px; flex:1; background:linear-gradient(90deg,transparent,var(--fw-gold)); }
  .divider-rule:after{ transform:rotate(180deg); }
  .header-row .divider-rule{ grid-column:1/-1; }
  .divider-rule svg{ width:20px; height:20px; flex-shrink:0; }

  .hero{ }
  .hero-img{ width:100%; height:100%; object-fit:cover; object-position:center 35%; display:block; }
  .hero-vignette{
    position:absolute; inset:0; pointer-events:none; z-index:1;
    background:
      linear-gradient(90deg, rgba(43,34,26,.78) 0%, rgba(43,34,26,.30) 42%, rgba(43,34,26,0) 62%),
      linear-gradient(180deg, rgba(43,34,26,.15) 0%, rgba(43,34,26,.55) 100%);
  }
  .hero-eyebrow-pill{
    position:absolute; z-index:1; top:28px; left:30px; padding:10px 18px;
    display:flex; align-items:center; gap:10px; border-radius:40px;
    background:rgba(247,236,216,.94); border:1px solid rgba(201,162,74,.65);
    color:var(--fw-burgundy); font-size:14px;
  }
  .hero-eyebrow-pill:before{ content:''; width:7px; height:7px; border-radius:50%; background:var(--fw-burgundy); }
  .hero-copy{ position:absolute; z-index:1; left:44px; right:44px; top:170px; color:var(--fw-cream); text-shadow:0 2px 14px rgba(20,14,8,.45); }
  .hero-copy .caps{ font-size:14px; color:#F0E0BE; margin-bottom:14px; }
  .hero-copy h1{ font-family:'Cormorant Garamond',serif; font-size:78px; line-height:.98; font-weight:500; }
  .hero-copy h1 em{ color:var(--fw-gold-hi, #E8CE94); font-style:italic; font-weight:500; }
  .hero-subtitle{ font-size:40px; font-style:italic; color:#F0E0BE; margin-top:10px; }
  .hero-standfirst{ position:absolute; z-index:1; left:44px; right:44px; bottom:34px; font-size:24px; font-style:italic; color:var(--fw-cream); text-shadow:0 2px 14px rgba(20,14,8,.45); }

  .promise-panel{ padding:22px 36px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
  .promise-copy .caps{ font-size:14px; color:var(--fw-burgundy); margin-bottom:12px; }
  .tagline{ font-size:44px; font-weight:500; line-height:1.05; }
  .tagline em{ color:var(--fw-burgundy); font-style:italic; }
  .subtext{ font-size:22px; font-style:italic; margin-top:12px; color:var(--fw-charcoal-soft, var(--fw-charcoal)); }
  .add-ons{ font-family:'Jost',sans-serif; font-size:14px; color:var(--fw-charcoal-muted); margin-top:14px; }

  .price-seal{
    width:190px; height:190px; flex-shrink:0; border:1.5px solid var(--fw-gold); border-radius:50%;
    background:var(--fw-cream); color:var(--fw-burgundy); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    box-shadow:0 0 0 5px rgba(247,236,216,.6), 0 8px 22px rgba(122,33,48,.08);
  }
  .price-total{ font-size:58px; font-weight:700; line-height:1.05; }
  .price-total span{ display:block; font-family:'Cormorant SC',serif; font-size:18px; font-weight:600; letter-spacing:.16em; }

  .benefits{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:22px; }
  .benefit-card{ padding:24px 22px; }
  .benefit-top{ display:flex; align-items:center; justify-content:space-between; }
  .benefit-top .caps{ font-size:12px; color:var(--fw-gold-deep); }
  .benefit-card .icon-frame{ width:58px; height:58px; margin:0; border:1px solid var(--fw-gold); border-radius:50%; background:rgba(247,236,216,.6); display:flex; align-items:center; justify-content:center; }
  .benefit-card h3{ font-size:24px; font-weight:700; margin-top:18px; line-height:1.08; }
  .benefit-card p{ font-family:'Jost',sans-serif; font-size:14.5px; line-height:1.44; color:var(--fw-charcoal-muted); margin-top:8px; }

  .included-panel{ padding:24px 30px; display:flex; flex-direction:column; }
  .included-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; }
  .included-head .caps{ font-size:16px; color:var(--fw-burgundy); }
  .included-note{ font-family:'Jost',sans-serif; font-size:12.5px; letter-spacing:.08em; color:var(--fw-charcoal-muted); text-transform:uppercase; }
  .steps{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:14px; flex:1; align-items:center; }
  .step{ text-align:center; position:relative; }
  .step:not(:last-child):after{ content:'›'; position:absolute; right:-11px; top:24px; color:var(--fw-gold-deep); font-size:30px; }
  .icon-frame{ position:relative; width:68px; height:68px; border:1px solid var(--fw-gold); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; background:rgba(247,236,216,.6); }
  .icon-frame > svg{ width:38px; height:38px; }
  .step-num{ position:absolute; top:-6px; left:-4px; width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:var(--fw-burgundy); border:1px solid var(--fw-gold); color:var(--fw-cream); font:500 14px 'Jost',sans-serif; }
  .step h3{ font-size:15px; line-height:1.14; letter-spacing:.02em; }

  .footer-bar{ border:1px solid var(--fw-gold); text-align:center; padding:10px 0; font-size:14px; letter-spacing:.13em; color:var(--fw-burgundy); display:flex; align-items:center; justify-content:center; }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useEffect, useState, useRef, useMemo } = React;
const m = window.Motion.motion;

function App(){

  const springIn = (delay=0)=>({
    initial:{ opacity:0, y:40, scale:0.95 },
    animate:{ opacity:1, y:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const breathe = (phase=0)=>({
    animate:{ y: [0, -2, 0, 2, 0] },
    transition:{ duration:4, repeat:Infinity, ease:'easeInOut', delay: phase }
  });

  const GoldFrame = ({ r=28, delay=0.4, color="rgba(201,162,74,0.55)" })=> (
    <svg className="gold-frame" viewBox="0 0 100 100" preserveAspectRatio="none">
      <m.rect
        x="0.5" y="0.5" width="99" height="99" rx={r/2.4} ry={r/2.4}
        fill="none" stroke={color} strokeWidth="0.18"
        pathLength="1"
        initial={{ pathLength: 0, opacity: 0 }}
        animate={{ pathLength: 1, opacity: 1 }}
        transition={{ duration: 1.4, delay, ease: 'easeOut' }}
      />
    </svg>
  );

  const benefits = [
    { icon: <SunIcon/>,    title:'Vitamin C Glow',         body:'Brightens dull skin and reveals a fresh, radiant look.' },
    { icon: <HoneyIcon/>,  title:'Honey Hydration',        body:'Locks in moisture for soft, smooth, healthy-looking skin.' },
    { icon: <OrangeIcon/>, title:'Orange Revitalization',  body:'Antioxidant-rich citrus refreshes and evens skin tone.' },
  ];

  const included = [
    { n:1, title:'Sea Salt Soak',      icon:<SaltBowlIcon/> },
    { n:2, title:'Honey Sugar Scrub',  icon:<ScrubJarIcon/> },
    { n:3, title:'Mud Masque',         icon:<MudJarIcon/> },
    { n:4, title:'Massage Lotion',     icon:<LotionIcon/> },
    { n:5, title:'Real Orange Slices', icon:<OrangeSliceIcon/> },
  ];

  return (
    <>
      <div className="stage" aria-hidden="true">
        {[1,2,3].map(n=>(
          <m.div key={n} className={'orb orb-'+n}
            animate={{ x:[0,25,-15,0], y:[0,-18,12,0] }}
            transition={{ duration:18+n*2, repeat:Infinity, ease:'easeInOut', delay:n*0.4 }}/>
        ))}
        {['tl','tr','bl','br'].map(c=><BotanicalCorner key={c} corner={c}/>)}
      </div>

      <div className="content-frame">

        {/* ─── Header ─── */}
        <m.div {...springIn(0.05)} className="glass glass-strong header-row">
          <GoldFrame delay={0.5}/>
          <div className="panel-content">
            <div className="caps wordmark" aria-label="DELUXE NAIL SPA">DELU<span>X</span>E NAIL SPA</div>
            <div className="caps brand-subline">BEAUTY · CARE · RELAXATION</div>
          </div>
          <div className="collection-lockup panel-content">
            <div className="caps collection-badge">Signature Pedicure · Year Round</div>
          </div>
          <DividerRule/>
        </m.div>

        {/* ─── Hero ─── */}
        <m.div {...springIn(0.15)} className="glass hero">
          <GoldFrame delay={0.7}/>
          <m.div style={{ width:'100%', height:'100%' }}
            initial={{ scale:0.92 }}
            animate={{ scale:[1, 1.015, 1] }}
            transition={{ scale:{ duration:5, repeat:Infinity, ease:'easeInOut' } }}>
            <img src="assets/honey-orange-hero.png" alt="Fresh oranges and honey flat-lay" className="hero-img"/>
          </m.div>
          <div className="hero-vignette"/>

          <m.div className="caps hero-eyebrow-pill"
            initial={{ opacity:0, y:-10 }} animate={{ opacity:1, y:0 }}
            transition={{ delay:0.9, duration:0.6 }}>
            Deluxe Pedicure · 50 Min
          </m.div>

          <m.div className="hero-copy" initial={{ opacity:0, y:24 }} animate={{ opacity:1, y:0 }}
            transition={{ delay:1.0, duration:0.7, ease:'easeOut' }}>
            <div className="caps">Vitamin C Brightening · Warm Oil Therapy</div>
            <h1>Honey <em>Orange</em> Zest</h1>
            <div className="hero-subtitle">Spa Pedicure</div>
          </m.div>

          <m.div className="hero-standfirst"
            initial={{ opacity:0, y:14 }} animate={{ opacity:1, y:0 }}
            transition={{ delay:1.25, duration:0.6 }}>
            Vitamin C brightening + warm oil therapy.
          </m.div>
        </m.div>

        {/* ─── Promise + price ─── */}
        <m.div {...springIn(0.30)} className="glass glass-strong promise-panel">
          <GoldFrame delay={0.95}/>
          <m.div className="promise-copy panel-content" {...breathe(0.2)}>
            <div className="caps">The Promise</div>
            <div className="tagline">Brighten. Hydrate. <em>Glow.</em></div>
            <div className="subtext">Real orange. Real honey. Real radiance.</div>
            <div className="add-ons">Gel polish &amp; add-ons available</div>
          </m.div>
          <m.div className="price-seal panel-content"
            initial={{ opacity:0, scale:0.4 }} animate={{ opacity:1, scale:1 }}
            transition={{ type:'spring', stiffness:220, damping:11, delay:0.45 }}>
            <div className="price-total"><span>From</span>$55</div>
          </m.div>
        </m.div>

        {/* ─── Benefits ─── */}
        <div className="benefits">
          {benefits.map((b,i)=>(
            <m.div key={b.title} {...springIn(0.60 + i*0.10)} className="glass benefit-card">
              <GoldFrame delay={0.85 + i*0.1} r={22}/>
              <m.div className="panel-content" {...breathe(i*0.3)}>
                <div className="benefit-top">
                  <div className="icon-frame">{b.icon}</div>
                  <span className="caps">0{i+1}</span>
                </div>
                <h3>{b.title}</h3>
                <p>{b.body}</p>
              </m.div>
            </m.div>
          ))}
        </div>

        {/* ─── Included ritual ─── */}
        <m.div {...springIn(0.90)} className="glass glass-strong included-panel">
          <GoldFrame delay={1.30}/>
          <div className="panel-content included-head">
            <span className="caps">What's Included</span>
            <span className="included-note">5 Steps · From $55</span>
          </div>
          <div className="steps panel-content">
            {included.map((item,i)=>(
              <m.div key={item.n} className="step"
                initial={{ opacity:0, x:-14 }} animate={{ opacity:1, x:0 }}
                transition={{ delay:0.95 + i*0.08, duration:0.5, ease:'easeOut' }}>
                <div className="icon-frame">
                  <m.span className="step-num"
                    initial={{ scale:0, opacity:0 }} animate={{ scale:1, opacity:1 }}
                    transition={{ delay:1.02 + i*0.08, type:'spring', stiffness:260, damping:14 }}>
                    {item.n}
                  </m.span>
                  {item.icon}
                </div>
                <h3 className="caps">{item.title}</h3>
              </m.div>
            ))}
          </div>
        </m.div>

        {/* ─── Footer ─── */}
        <m.div {...springIn(1.50)} className="caps footer-bar">
          Ready When You Are · Ask At The Front Desk
        </m.div>

      </div>
    </>
  );
}

/* ── shared editorial helpers ─────────────────────────────── */
function DividerRule({children}){return <div className="divider-rule"><LeafIcon/>{children}{children && <LeafIcon/>}</div>;}
function LeafIcon(){return <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20Q2 3 21 3Q21 21 4 20ZM4 20L16 8" stroke="currentColor" strokeWidth="1.4" fill="rgba(201,162,74,.12)"/></svg>;}
function BotanicalCorner({corner}){return <svg className={'botanical '+corner} viewBox="0 0 150 260" fill="none"><path d="M70 250Q110 125 55 10" stroke="currentColor" strokeWidth="2"/>{[0,1,2,3,4].map(n=><g key={n} transform={'translate(0 '+n*43+')'}><path d="M77 48Q12 35 34 3Q75 14 77 48ZM80 58Q135 40 121 13Q87 23 80 58Z" fill="currentColor"/></g>)}</svg>;}

/* ── benefit icons ─────────────────────────────────────────── */
function SunIcon(){
  return (
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="6" stroke="var(--fw-charcoal)" strokeWidth="1.6" fill="rgba(201,162,74,0.30)"/>
      <g stroke="var(--fw-gold-deep)" strokeWidth="1.8" strokeLinecap="round">
        <line x1="16" y1="3" x2="16" y2="7"/>
        <line x1="16" y1="25" x2="16" y2="29"/>
        <line x1="3" y1="16" x2="7" y2="16"/>
        <line x1="25" y1="16" x2="29" y2="16"/>
        <line x1="6.5" y1="6.5" x2="9.5" y2="9.5"/>
        <line x1="22.5" y1="22.5" x2="25.5" y2="25.5"/>
        <line x1="6.5" y1="25.5" x2="9.5" y2="22.5"/>
        <line x1="22.5" y1="9.5" x2="25.5" y2="6.5"/>
      </g>
      <path d="M13 15 a3 3 0 0 0 3 3" stroke="var(--fw-burgundy)" strokeWidth="1.4" strokeLinecap="round" fill="none"/>
    </svg>
  );
}
function HoneyIcon(){
  return (
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
      <path d="M16 5 L23 9 V17 L16 21 L9 17 V9 Z" stroke="var(--fw-charcoal)" strokeWidth="1.6" strokeLinejoin="round" fill="rgba(201,162,74,0.30)"/>
      <path d="M16 9 L19.5 11 V15 L16 17 L12.5 15 V11 Z" stroke="var(--fw-gold-deep)" strokeWidth="1.4" strokeLinejoin="round" fill="rgba(201,162,74,0.45)"/>
      <path d="M16 22 V28" stroke="var(--fw-gold-deep)" strokeWidth="1.6" strokeLinecap="round"/>
      <path d="M14 26 C 15 27, 17 27, 18 26" stroke="var(--fw-burgundy)" strokeWidth="1.4" strokeLinecap="round" fill="none"/>
    </svg>
  );
}
function OrangeIcon(){
  return (
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="17" r="10" stroke="var(--fw-charcoal)" strokeWidth="1.6" fill="rgba(122,33,48,0.18)"/>
      <g stroke="var(--fw-gold-deep)" strokeWidth="1.1" fill="none">
        <line x1="16" y1="7" x2="16" y2="27"/>
        <line x1="6" y1="17" x2="26" y2="17"/>
        <line x1="9" y1="10" x2="23" y2="24"/>
        <line x1="23" y1="10" x2="9" y2="24"/>
      </g>
      <path d="M14 6 C 16 3, 19 4, 19 7 C 17.5 7.5, 15 7.5, 14 6 Z" stroke="var(--fw-charcoal)" strokeWidth="1.3" strokeLinejoin="round" fill="rgba(124,156,90,0.55)"/>
    </svg>
  );
}

/* ── included-ritual icons ─────────────────────────────────────────── */
function SaltBowlIcon(){
  return (
    <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
      <path d="M15 5 C 15 3, 17 3, 17 5 C 17 7, 15 7, 15 9" stroke="var(--fw-gold-deep)" strokeWidth="1.4" strokeLinecap="round" fill="none"/>
      <path d="M20 4 C 20 2, 22 2, 22 4 C 22 6, 20 6, 20 8" stroke="var(--fw-gold-deep)" strokeWidth="1.4" strokeLinecap="round" fill="none"/>
      <path d="M6 18 H 32 C 31 27, 26 31, 19 31 C 12 31, 7 27, 6 18 Z"
        stroke="var(--fw-charcoal)" strokeWidth="1.6" strokeLinejoin="round" fill="rgba(201,162,74,0.22)"/>
      <ellipse cx="19" cy="18" rx="13" ry="2" stroke="var(--fw-charcoal)" strokeWidth="1.6" fill="rgba(201,162,74,0.32)"/>
      <circle cx="14" cy="17" r="0.8" fill="var(--fw-cream)"/>
