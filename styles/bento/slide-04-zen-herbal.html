<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>Deluxe Nail Spa — Herbal Spa Pedicure Treatment</title>

<!-- fonts vendored locally -->

<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<link href="../../vendor/fonts-editorial/fonts-editorial.css" rel="stylesheet">

<link href="../../vendor/mini-tw.css" rel="stylesheet">
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../vendor/framer-motion.js"></script>
<script src="../../vendor/babel.min.js"></script>

<style>
  :root{
    --cream-100:#F5E6D8;
    --cream-200:#E8D5C4;
    --cream-300:#D4B8A0;
    --blush:#E8C4B4;
    --sage:#B5C4A8;
    --gold:#B8965A;
    --gold-hi:#D4B886;
    --charcoal:#1F1B16;
    --charcoal-soft:rgba(31,27,22,0.78);
    --charcoal-muted:rgba(31,27,22,0.55);
    --glass-fill:rgba(255, 251, 246, 0.42);
    --glass-stroke:rgba(255, 255, 255, 0.55);
    --glass-shadow: 0 24px 60px -20px rgba(60, 40, 20, 0.22), 0 6px 16px -8px rgba(60, 40, 20, 0.16);

    --fw-cream:#F7ECD8;
    --fw-cream-deep:#F3E3C9;
    --fw-burgundy:#7A2130;
    --fw-burgundy-light:#8C2A3A;
    --fw-gold:#C9A24A;
    --fw-gold-deep:#B8862E;
    --fw-charcoal:#2B221A;
    --fw-charcoal-muted:rgba(43,34,26,0.62);
  }
  html, body{
    width:1080px; height:1920px; margin:0; padding:0;
    background:var(--fw-cream);
    overflow:hidden;
    font-family: 'Cormorant Garamond', serif;
    color: var(--fw-charcoal);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    cursor:none;
  }
  *{ box-sizing:border-box; }
  h1,h2,h3,p{ margin:0; }
  #root{ width:1080px; height:1920px; position:relative; }
  .glass{
    position:relative;
    background: var(--glass-fill);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--glass-stroke);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.45);
    border-radius: 28px;
    overflow:hidden;
  }
  .glass-strong{
    background: rgba(255, 251, 246, 0.58);
  }
  .glass::after{
    content:""; position:absolute; left:0; right:0; top:0; height:50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
    pointer-events:none; z-index:0; opacity:.4;
  }
  .glass > :not(.gold-frame){ position:relative; z-index:1; }
  .gold-frame{
    position:absolute; inset:0; pointer-events:none;
    border-radius:inherit;
  }

  .caps{ font-family:'Cormorant SC',serif; text-transform:uppercase; letter-spacing:.13em; font-weight:600; }

  .stage{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 4% 36%, rgba(122,33,48,.14), transparent 52%),
      radial-gradient(ellipse at 96% 82%, rgba(201,162,74,.24), transparent 55%),
      linear-gradient(165deg, var(--fw-cream), var(--fw-cream-deep));
  }
  .orb{ position:absolute; border-radius:50%; filter:blur(60px); mix-blend-mode:multiply; opacity:.20; pointer-events:none; }
  .orb-1{ width:520px; height:520px; left:-180px; top:200px; background:radial-gradient(circle, var(--fw-burgundy), transparent 65%); }
  .orb-2{ width:600px; height:600px; right:-200px; top:640px; background:radial-gradient(circle, var(--fw-gold), transparent 65%); }
  .orb-3{ width:480px; height:480px; left:60px; bottom:-100px; background:radial-gradient(circle, var(--fw-burgundy-light), transparent 65%); opacity:.12; }

  .botanical{ position:absolute; width:150px; height:260px; opacity:.16; color:var(--fw-burgundy); pointer-events:none; }
  .botanical.tl{ left:-64px; top:-50px; transform:rotate(-25deg); }
  .botanical.tr{ right:-66px; top:-40px; transform:scaleX(-1) rotate(-25deg); color:var(--fw-gold-deep); }
  .botanical.bl{ left:-65px; bottom:-35px; transform:rotate(190deg); color:var(--fw-gold-deep); }
  .botanical.br{ right:-65px; bottom:-35px; transform:rotate(160deg); }

  .content-frame{ position:relative; width:100%; height:100%; padding:36px 44px; display:grid;
    grid-template-rows: 140px 630px 220px 220px 170px 284px 88px; gap:16px; }

  .header-row{ padding:20px 28px 12px; display:grid; grid-template-columns:1fr auto; align-items:center; }
  .panel-content{ position:relative; z-index:1; }
  .wordmark{ font-size:35px; letter-spacing:.12em; white-space:nowrap; }
  .wordmark span{ color:var(--fw-gold-deep); }
  .brand-subline{ font-size:15px; margin-top:5px; letter-spacing:.2em; }
  .collection-lockup{ text-align:right; }
  .collection-badge{ display:inline-block; border:1px solid var(--fw-gold); border-radius:40px; padding:9px 24px; text-align:center; font-size:14px; line-height:1.3; color:var(--fw-burgundy); white-space:nowrap; }
  .divider-rule{ display:flex; align-items:center; gap:12px; color:var(--fw-gold-deep); }
  .divider-rule:before,.divider-rule:after{ content:''; height:1px; flex:1; background:linear-gradient(90deg,transparent,var(--fw-gold)); }
  .divider-rule:after{ transform:rotate(180deg); }
  .header-row .divider-rule{ grid-column:1/-1; }
  .divider-rule svg{ width:20px; height:20px; flex-shrink:0; }

  .hero-svg-wrap{
    width:100%; height:100%; position:absolute; inset:0;
    background:
      radial-gradient(ellipse 70% 60% at 50% 55%, rgba(239, 230, 210, 0.95), transparent 75%),
      linear-gradient(170deg, #F0E4CC 0%, #DCD2B8 50%, #C9BFA3 100%);
  }
  .hero-img{ width:100%; height:100%; object-fit:cover; display:block; }
  .hero-vignette{
    position:absolute; inset:0; pointer-events:none; z-index:1;
    background:
      linear-gradient(180deg, rgba(43,34,26,0.00) 42%, rgba(43,34,26,0.72) 100%),
      linear-gradient(90deg, rgba(43,34,26,0.22) 0%, rgba(43,34,26,0) 38%);
  }
  .hero-eyebrow-pill{
    position:absolute; z-index:1; top:24px; left:26px; padding:10px 18px;
    display:flex; align-items:center; gap:10px; border-radius:40px;
    background:rgba(247,236,216,.94); border:1px solid rgba(201,162,74,.65);
    color:var(--fw-burgundy); font-size:13px;
  }
  .hero-eyebrow-pill:before{ content:''; width:7px; height:7px; border-radius:50%; background:var(--fw-burgundy); }
  .hero-copy{ position:absolute; z-index:1; left:40px; right:40px; bottom:34px; color:var(--fw-cream); text-shadow:0 2px 14px rgba(43,34,26,.45); }
  .hero-copy .caps{ font-size:13px; color:#F0E0BE; margin-bottom:12px; }
  .hero-copy h1{ font-family:'Cormorant Garamond',serif; font-size:74px; line-height:.96; font-weight:500; }
  .hero-copy .hero-experience{ font-size:40px; font-style:italic; color:var(--fw-gold-hi,#E8CE94); margin-top:8px; }
  .hero-copy .hero-standfirst{ font-size:19px; font-style:italic; margin-top:14px; max-width:620px; line-height:1.3; }

  .promise-panel{ padding:20px 34px; display:flex; align-items:center; justify-content:space-between; gap:22px; }
  .promise-copy .caps{ font-size:13px; color:var(--fw-burgundy); margin-bottom:10px; }
  .tagline{ font-size:40px; font-weight:500; line-height:1.05; }
  .tagline em{ color:var(--fw-burgundy); font-style:italic; }
  .subtext{ font-size:18px; font-style:italic; margin-top:10px; color:var(--fw-gold-deep); }
  .add-ons{ font-family:'Jost',sans-serif; font-size:13.5px; color:var(--fw-charcoal-muted); margin-top:13px; }

  .price-seal{
    width:172px; height:172px; flex-shrink:0; border:1.5px solid var(--fw-gold); border-radius:50%;
    background:var(--fw-cream); color:var(--fw-burgundy); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    box-shadow:0 0 0 5px rgba(247,236,216,.6), 0 8px 22px rgba(122,33,48,.08);
  }
  .price-seal .caps{ font-size:11px; margin-top:2px; }
  .price-total{ font-size:52px; font-weight:700; line-height:1.02; }
  .price-total span{ display:block; font-family:'Cormorant SC',serif; font-size:16px; font-weight:600; letter-spacing:.16em; }

  .benefits{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px; }
  .blends{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px; }
  .benefit-card{ padding:20px 20px; }
  .benefit-top{ display:flex; align-items:center; justify-content:space-between; }
  .benefit-top .caps{ font-size:11px; color:var(--fw-gold-deep); }
  .benefit-card .icon-frame{ width:52px; height:52px; margin:0; border:1px solid var(--fw-gold); border-radius:50%; background:rgba(247,236,216,.6); display:flex; align-items:center; justify-content:center; }
  .benefit-card h3{ font-size:21px; font-weight:700; margin-top:14px; line-height:1.06; }
  .benefit-card p{ font-family:'Jost',sans-serif; font-size:13px; line-height:1.4; color:var(--fw-charcoal-muted); margin-top:7px; }

  .blend-card{ padding:16px 18px; display:flex; flex-direction:column; }
  .blend-top{ display:flex; align-items:center; gap:12px; }
  .blend-card .icon-frame{ width:44px; height:44px; margin:0; border:1px solid var(--fw-gold); border-radius:50%; background:rgba(247,236,216,.6); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .blend-card h3{ font-size:18px; font-weight:700; color:var(--fw-burgundy); line-height:1.05; }
  .blend-card p{ font-family:'Jost',sans-serif; font-size:12.5px; line-height:1.36; color:var(--fw-charcoal-muted); margin-top:10px; }

  .included-panel{ padding:20px 28px; display:flex; flex-direction:column; }
  .included-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .included-head .caps{ font-size:14px; color:var(--fw-burgundy); }
  .included-note{ font-family:'Jost',sans-serif; font-size:11.5px; letter-spacing:.08em; color:var(--fw-charcoal-muted); text-transform:uppercase; }
  .steps{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:10px; flex:1; align-items:center; }
  .step{ text-align:center; position:relative; }
  .step:not(:last-child):after{ content:'›'; position:absolute; right:-9px; top:22px; color:var(--fw-gold-deep); font-size:26px; }
  .icon-frame{ position:relative; width:62px; height:62px; border:1px solid var(--fw-gold); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; background:rgba(247,236,216,.6); }
  .icon-frame > svg{ width:34px; height:34px; }
  .step-num{ position:absolute; top:-6px; left:-4px; width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:var(--fw-burgundy); border:1px solid var(--fw-gold); color:var(--fw-cream); font:500 13px 'Jost',sans-serif; }
  .step h3{ font-size:13.5px; line-height:1.16; letter-spacing:.01em; }

  .footer-bar{ border:1px solid var(--fw-gold); text-align:center; padding:10px 0; font-size:14px; letter-spacing:.13em; color:var(--fw-burgundy); display:flex; align-items:center; justify-content:center; }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useEffect, useState, useRef, useMemo } = React;
const m = window.Motion.motion;

function App(){
  const [heroImgFailed, setHeroImgFailed] = useState(false);

  const springIn = (delay=0)=>({
    initial:{ opacity:0, y:40, scale:0.95 },
    animate:{ opacity:1, y:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const breathe = (phase=0)=>({
    animate:{ y: [0, -2, 0, 2, 0] },
    transition:{ duration:4, repeat:Infinity, ease:'easeInOut', delay: phase }
  });

  const GoldFrame = ({ r=28, delay=0.4, color="rgba(201,162,74,0.55)" })=> (
    <svg className="gold-frame" viewBox="0 0 100 100" preserveAspectRatio="none">
      <m.rect
        x="0.5" y="0.5" width="99" height="99" rx={r/2.4} ry={r/2.4}
        fill="none" stroke={color} strokeWidth="0.18"
        pathLength="1"
        initial={{ pathLength: 0, opacity: 0 }}
        animate={{ pathLength: 1, opacity: 1 }}
        transition={{ duration: 1.4, delay, ease: 'easeOut' }}
      />
    </svg>
  );

  const benefits = [
    { icon: <DetoxIcon/>,  title:'Detox & Refresh',
      body:'A warm herbal soak cleanses tired feet, reduces odor, leaves skin renewed.' },
    { icon: <ReliefIcon/>, title:'Deep Muscle Relief',
      body:'A 20-minute Renuspa treatment improves circulation and eases deep tension.' },
    { icon: <LotusIcon/>,  title:'Calm & Restore',
      body:'Lavender, chamomile, eucalyptus, and green tea — a peaceful spa escape.' },
  ];

  const blends = [
    { icon:<EucalyptusLeafIcon/>, title:'Detox Boost',    body:'Eucalyptus + green tea to refresh and purify.' },
    { icon:<MintLeafIcon/>,       title:'Muscle Relief',  body:'Peppermint + rosemary to ease tired feet.' },
    { icon:<LavenderLeafIcon/>,   title:'Pure Calm',       body:'Lavender + chamomile for deep relaxation.' },
  ];

  const included = [
    { n:1, title:'10-Min Warm Herbal Foot Soak',  icon:<SoakIcon/> },
    { n:2, title:'20-Min Renuspa Treatment',      icon:<RenuspaIcon/> },
    { n:3, title:'Deep Steam Therapy',            icon:<SteamIcon/> },
    { n:4, title:'Botanical Exfoliation',         icon:<ExfoliateIcon/> },
    { n:5, title:'Hot Towel Finish',              icon:<TowelIcon/> },
  ];

  return (
    <>
      <div className="stage" aria-hidden="true">
        {[1,2,3].map(n=>(
          <m.div key={n} className={'orb orb-'+n}
            animate={{ x:[0,25,-15,0], y:[0,-18,12,0] }}
            transition={{ duration:18+n*2, repeat:Infinity, ease:'easeInOut', delay:n*0.4 }}/>
        ))}
        {['tl','tr','bl','br'].map(c=><BotanicalCorner key={c} corner={c}/>)}
      </div>

      <div className="content-frame">

        {/* ─── Header ─── */}
        <m.div {...springIn(0.05)} className="glass glass-strong header-row">
          <GoldFrame delay={0.5}/>
          <div className="panel-content">
            <div className="caps wordmark" aria-label="DELUXE NAIL SPA">DELU<span>X</span>E NAIL SPA</div>
            <div className="caps brand-subline">BEAUTY · CARE · RELAXATION</div>
          </div>
          <div className="collection-lockup panel-content">
            <div className="caps collection-badge">Signature Pedicure · Deluxe House Treatment</div>
          </div>
          <DividerRule/>
        </m.div>

        {/* ─── Hero ─── */}
        <m.div {...springIn(0.15)} className="glass hero">
          <GoldFrame delay={0.7}/>
          {heroImgFailed ? (
            <HeroSVG/>
          ) : (
            <m.div style={{ width:'100%', height:'100%' }}
              initial={{ scale:0.92 }}
              animate={{ scale:[1, 1.015, 1] }}
              transition={{ scale:{ duration:5, repeat:Infinity, ease:'easeInOut' } }}>
              <img src="assets/zen-herbal-hero.png" alt="Herbal foot bath with eucalyptus, lavender and chamomile"
                className="hero-img"
                onError={()=>setHeroImgFailed(true)}/>
            </m.div>
          )}
          <div className="hero-vignette"/>

          <m.div className="caps hero-eyebrow-pill"
            initial={{ opacity:0, y:-10 }} animate={{ opacity:1, y:0 }}
            transition={{ delay:0.9, duration:0.6 }}>
            Deluxe Pedicure · Signature Treatment
          </m.div>

          <m.div className="hero-copy" initial={{ opacity:0, y:24 }} animate={{ opacity:1, y:0 }}
            transition={{ delay:1.0, duration:0.7, ease:'easeOut' }}>
            <div className="caps">75-Minute Botanical Foot Treatment</div>
            <h1>Herbal Spa<br/>Pedicure</h1>
            <div className="hero-experience">Experience</div>
            <p className="hero-standfirst">A warm botanical foot treatment for deep relaxation, detox, and renewal.</p>
          </m.div>
        </m.div>

        {/* ─── Promise + price ─── */}
        <m.div {...springIn(0.30)} className="glass glass-strong promise-panel">
          <GoldFrame delay={0.95}/>
          <m.div className="promise-copy panel-content" {...breathe(0.2)}>
            <div className="caps">The Promise</div>
            <div className="tagline">Detox. Restore. <em>Breathe.</em></div>
            <div className="subtext">Eucalyptus · Lavender · Chamomile · Green Tea</div>
            <div className="add-ons">Gel polish &amp; add-ons available</div>
          </m.div>
          <m.div className="price-seal panel-content"
            initial={{ opacity:0, scale:0.4 }} animate={{ opacity:1, scale:1 }}
            transition={{ type:'spring', stiffness:220, damping:11, delay:0.45 }}>
            <div className="price-total"><span>From</span>$85</div>
            <div className="caps">Signature Service</div>
          </m.div>
        </m.div>

        {/* ─── Benefits ─── */}
        <div className="benefits">
          {benefits.map((b,i)=>(
            <m.div key={b.title} {...springIn(0.55 + i*0.08)} className="glass benefit-card">
              <GoldFrame delay={0.80 + i*0.08} r={22}/>
              <m.div className="panel-content" {...breathe(i*0.3)}>
                <div className="benefit-top">
                  <div className="icon-frame">{b.icon}</div>
                  <span className="caps">0{i+1}</span>
                </div>
                <h3>{b.title}</h3>
                <p>{b.body}</p>
              </m.div>
            </m.div>
          ))}
        </div>

        {/* ─── Botanical exfoliation blends ─── */}
        <div className="blends">
          {blends.map((b,i)=>(
            <m.div key={b.title} {...springIn(0.95 + i*0.08)} className="glass blend-card">
              <GoldFrame delay={1.20 + i*0.08} r={22}/>
              <m.div className="panel-content" {...breathe(i*0.35 + 0.1)}>
                <div className="blend-top">
                  <div className="icon-frame">{b.icon}</div>
                  <h3>{b.title}</h3>
                </div>
                <p>{b.body}</p>
              </m.div>
            </m.div>
          ))}
        </div>

        {/* ─── Included ritual ─── */}
        <m.div {...springIn(1.30)} className="glass glass-strong included-panel">
          <GoldFrame delay={1.55}/>
          <div className="panel-content included-head">
            <span className="caps">What's Included in the 75-Minute Treatment</span>
            <span className="included-note">5 Steps · From $85</span>
          </div>
          <div className="steps panel-content">
            {included.map((item,i)=>(
              <m.div key={item.n} className="step"
                initial={{ opacity:0, x:-14 }} animate={{ opacity:1, x:0 }}
                transition={{ delay:1.40 + i*0.06, duration:0.5, ease:'easeOut' }}>
                <div className="icon-frame">
                  <m.span className="step-num"
                    initial={{ scale:0, opacity:0 }} animate={{ scale:1, opacity:1 }}
                    transition={{ delay:1.46 + i*0.06, type:'spring', stiffness:260, damping:14 }}>
                    {item.n}
                  </m.span>
                  {item.icon}
                </div>
                <h3 className="caps">{item.title}</h3>
              </m.div>
            ))}
          </div>
        </m.div>

        {/* ─── Footer ─── */}
        <m.div {...springIn(1.85)} className="caps footer-bar">
          Perfect for tired feet, dry skin, and deep relaxation.
        </m.div>

      </div>
    </>
  );
}

/* ── shared editorial helpers ─────────────────────────────── */
function DividerRule({children}){return <div className="divider-rule"><LeafIcon/>{children}{children && <LeafIcon/>}</div>;}
function LeafIcon(){return <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20Q2 3 21 3Q21 21 4 20ZM4 20L16 8" stroke="currentColor" strokeWidth="1.4" fill="rgba(201,162,74,.12)"/></svg>;}
function BotanicalCorner({corner}){return <svg className={'botanical '+corner} viewBox="0 0 150 260" fill="none"><path d="M70 250Q110 125 55 10" stroke="currentColor" strokeWidth="2"/>{[0,1,2,3,4].map(n=><g key={n} transform={'translate(0 '+n*43+')'}><path d="M77 48Q12 35 34 3Q75 14 77 48ZM80 58Q135 40 121 13Q87 23 80 58Z" fill="currentColor"/></g>)}</svg>;}

/* ─────────────────────────────────────────────────────────────── */
/* Hero SVG illustration — wooden bowl with herbs & steam (fallback if the real photo fails to load) */
/* ─────────────────────────────────────────────────────────────── */
function HeroSVG(){
  return (
    <div className="hero-svg-wrap">
      <svg viewBox="0 0 1080 560" preserveAspectRatio="xMidYMid slice" style={{ width:'100%', height:'100%', display:'block' }}>
        <defs>
          <radialGradient id="bgGlow" cx="50%" cy="55%" r="60%">
            <stop offset="0%" stopColor="#F5EBD4" stopOpacity="1"/>
            <stop offset="60%" stopColor="#E5D7B8" stopOpacity="1"/>
            <stop offset="100%" stopColor="#C8BB9A" stopOpacity="1"/>
          </radialGradient>
          <radialGradient id="waterGrad" cx="50%" cy="50%" r="55%">
            <stop offset="0%" stopColor="#C9A04A" stopOpacity="0.95"/>
            <stop offset="55%" stopColor="#9B7A2E" stopOpacity="0.92"/>
            <stop offset="100%" stopColor="#5C4716" stopOpacity="0.95"/>
          </radialGradient>
          <linearGradient id="bowlOuter" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stopColor="#8C6437"/>
            <stop offset="50%" stopColor="#6B4824"/>
            <stop offset="100%" stopColor="#3F2A14"/>
          </linearGradient>
          <linearGradient id="bowlRim" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stopColor="#A07845"/>
            <stop offset="100%" stopColor="#6B4824"/>
          </linearGradient>
          <linearGradient id="towelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stopColor="#F0E4CC"/>
            <stop offset="100%" stopColor="#D8C9AC"/>
          </linearGradient>
          <radialGradient id="leafGrad" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stopColor="#9BBE85"/>
