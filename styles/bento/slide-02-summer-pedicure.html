<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>Deluxe Nail Spa — Fall/Winter Pedicure Special</title>

<!-- fonts vendored locally -->

<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<link href="../../vendor/fonts-editorial/fonts-editorial.css" rel="stylesheet">

<link href="../../vendor/mini-tw.css" rel="stylesheet">
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../vendor/framer-motion.js"></script>
<script src="../../vendor/babel.min.js"></script>

<style>
  :root{
    --cream-100:#F5E6D8;
    --cream-200:#E8D5C4;
    --cream-300:#D4B8A0;
    --blush:#E8C4B4;
    --sage:#B5C4A8;
    --gold:#B8965A;
    --gold-hi:#D4B886;
    --charcoal:#1F1B16;
    --charcoal-soft:rgba(31,27,22,0.78);
    --charcoal-muted:rgba(31,27,22,0.55);
    --glass-fill:rgba(255, 251, 246, 0.42);
    --glass-stroke:rgba(255, 255, 255, 0.55);
    --glass-shadow: 0 24px 60px -20px rgba(60, 40, 20, 0.22), 0 6px 16px -8px rgba(60, 40, 20, 0.16);


    --fw-cream:#F7ECD8;
    --fw-cream-deep:#F3E3C9;
    --fw-burgundy:#7A2130;
    --fw-burgundy-light:#8C2A3A;
    --fw-gold:#C9A24A;
    --fw-gold-deep:#B8862E;
    --fw-charcoal:#2B221A;
    --fw-charcoal-muted:rgba(43,34,26,0.62);
  }
  html, body{
    width:1080px; height:1920px; margin:0; padding:0;
    background:#E8D5C4;
    overflow:hidden;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--charcoal);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root{ width:1080px; height:1920px; position:relative; }
  .glass{
    position:relative;
    background: var(--glass-fill);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--glass-stroke);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.45);
    border-radius: 28px;
    overflow:hidden;
  }
  .glass-strong{
    background: rgba(255, 251, 246, 0.58);
  }
  .glass::after{
    content:""; position:absolute; left:0; right:0; top:0; height:50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
    pointer-events:none;
  }
  .gold-frame{
    position:absolute; inset:0; pointer-events:none;
    border-radius:inherit;
  }


  *{ box-sizing:border-box; }
  body{ cursor:none; color:var(--fw-charcoal); font-family:'Cormorant Garamond',serif; }
  h1,h2,h3,p{ margin:0; }
  .stage{ position:absolute; inset:0; background:radial-gradient(ellipse at 0% 38%,rgba(122,33,48,.14),transparent 52%),radial-gradient(ellipse at 95% 82%,rgba(201,162,74,.24),transparent 55%),linear-gradient(165deg,var(--fw-cream),var(--fw-cream-deep)); }
  .orb{ position:absolute; border-radius:50%; filter:blur(60px); mix-blend-mode:multiply; opacity:.22; pointer-events:none; }
  .orb-1{ width:520px;height:520px;left:-180px;top:220px;background:radial-gradient(circle,var(--fw-burgundy),transparent 65%); }
  .orb-2{ width:600px;height:600px;right:-200px;top:640px;background:radial-gradient(circle,var(--fw-gold),transparent 65%); }
  .orb-3{ width:480px;height:480px;left:60px;bottom:-100px;background:radial-gradient(circle,var(--fw-burgundy-light),transparent 65%);opacity:.12; }
  .content-frame{ position:relative;width:100%;height:100%;padding:36px 44px;display:grid;grid-template-rows:150px 270px 620px 164px 340px 224px;gap:16px; }
  .glass::after{ z-index:0;opacity:.4; }
  .glass > :not(.gold-frame){ position:relative;z-index:1; }
  .caps{ font-family:'Cormorant SC',serif;text-transform:uppercase;letter-spacing:.12em;font-weight:600; }
  .script{ font-family:'Great Vibes',cursive;color:var(--fw-gold-deep);font-weight:400; }
  .header-row{ padding:20px 28px 12px;display:grid;grid-template-columns:1fr 1fr;align-items:center; }
  .wordmark{ font-size:35px;letter-spacing:.12em;white-space:nowrap; }
  .wordmark span{ color:var(--fw-gold-deep); }
  .brand-subline{ font-size:15px;margin-top:5px;letter-spacing:.2em; }
  .collection-lockup{ text-align:right; }
  .collection-badge{ display:inline-block;border:1px solid var(--fw-gold);border-radius:40px;padding:8px 23px;text-align:center;font-size:16px;line-height:1.35;color:var(--fw-burgundy); }
  .collection-badge span{ display:block;font-size:13px; }
  .collection-lockup .script{ font-size:29px;margin-top:6px; }
  .divider-rule{ display:flex;align-items:center;gap:12px;color:var(--fw-gold-deep); }
  .divider-rule:before,.divider-rule:after{ content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--fw-gold)); }
  .divider-rule:after{ transform:rotate(180deg); }
  .header-row .divider-rule{ grid-column:1/-1; }
  .divider-rule svg{ width:20px;height:20px;flex-shrink:0; }
  .headline-panel{ padding:16px 30px;text-align:center;display:flex;flex-direction:column;justify-content:center; }
  h1{ font-size:62px;line-height:.98;font-weight:400; }
  h1 em{ color:var(--fw-burgundy);font-weight:400; }
  .headline-panel .caps{ font-size:18px;margin-top:18px; }
  .intro{ font-size:26px;line-height:1.16;max-width:840px;margin:12px auto 0; }
  .intro span{ color:var(--fw-burgundy);font-weight:600; }
  .choice-panel{ padding:22px 28px; }
  .choice-top{ height:204px;display:flex;align-items:center;justify-content:center; }
  .choice-top .divider-rule{ width:100%;gap:28px; }
  .price-seal{ width:200px;height:200px;flex-shrink:0;border:1.5px solid var(--fw-gold);border-radius:50%;background:var(--fw-cream);color:var(--fw-burgundy);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 5px rgba(247,236,216,.6),0 8px 22px rgba(122,33,48,.08); }
  .price-seal .caps{ font-size:13px; }
  .price-total{ font-size:68px;font-weight:700;line-height:.94;margin:3px 0; }
  .price-inclusions{ font-size:14px;line-height:1.12;width:174px;margin-top:7px; }
  .scent-grid{ display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;margin-top:12px; }
  .scent-card{ text-align:center;min-width:0; }
  .scent-art{ height:176px;border-radius:70px 70px 18px 18px;border:1px solid rgba(201,162,74,.38);display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#fff9e9 0%,transparent 65%),linear-gradient(135deg,#dfc18b,var(--fw-cream-deep),#cba260); }
  .scent-art.honey{ background:radial-gradient(ellipse at 45% 30%,#fff4d0,transparent 65%),linear-gradient(135deg,#ceaa61,var(--fw-cream-deep),#d6b77f); }
  .scent-art svg{ width:110px;height:110px;filter:drop-shadow(0 7px 8px rgba(136,93,33,.15)); }
  .ribbon-label{ display:inline-block;min-width:260px;border-radius:40px;background:var(--fw-burgundy);color:var(--fw-cream);font-size:33px;line-height:1.2;padding:6px 24px;margin-top:12px;font-weight:600; }
  .scent-notes{ font-size:14px;letter-spacing:.12em;margin-top:12px;color:var(--fw-burgundy);white-space:nowrap; }
  .scent-description{ font-size:24px;font-style:italic;line-height:1.1;margin:8px auto 0;max-width:365px; }
  .or-badge{ width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:auto;background:linear-gradient(155deg,var(--fw-burgundy-light),var(--fw-burgundy));border:1.5px solid var(--fw-gold);box-shadow:0 12px 24px -8px rgba(122,33,48,.35),inset 0 1px 0 rgba(255,220,200,.35);color:var(--fw-cream);font-family:'Cormorant SC',serif;font-size:21px; }
  .info-strip{ display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:22px 12px; }
  .info-item{ text-align:center;padding:0 12px; }
  .info-item + .info-item{ border-left:1px solid rgba(201,162,74,.6); }
  .info-item svg{ width:27px;height:27px;margin:0 auto 7px;display:block; }
  .info-item h3{ font-size:17px;color:var(--fw-burgundy);margin-bottom:7px; }
  .info-item p{ font-family:'Jost',sans-serif;font-size:12.5px;font-style:italic;line-height:1.35;white-space:nowrap; }
  .ritual-panel{ padding:24px 20px; }
  .section-title{ font-size:20px;white-space:nowrap; }
  .steps{ display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:30px; }
  .step{ text-align:center;position:relative; }
  .step:not(:last-child):after{ content:'›';position:absolute;right:-13px;top:20px;color:var(--fw-gold-deep);font-size:34px; }
  .icon-frame{ position:relative;width:76px;height:76px;border:1px solid var(--fw-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;background:rgba(247,236,216,.6); }
  .icon-frame > svg, .icon-frame > img{ width:44px;height:44px; }
  .step-num{ position:absolute;top:-7px;left:-6px;width:29px;height:29px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--fw-burgundy);border:1px solid var(--fw-gold);color:var(--fw-cream);font:500 16px 'Jost',sans-serif; }
  .step h3{ font-size:22px;line-height:1.02;min-height:46px;font-weight:600;margin-bottom:9px; }
  .step p{ font-family:'Jost',sans-serif;font-size:16px;line-height:1.28; }
  .closing-panel{ padding:14px 18px 12px;display:flex;flex-direction:column; }
  .gel-strip{ display:grid;grid-template-columns:1.1fr 1fr 92px;gap:16px;align-items:center;border:1px solid var(--fw-gold);padding:10px 17px; }
  .gel-title{ display:flex;align-items:center;gap:8px;font-size:24px;color:var(--fw-burgundy); }
  .gel-title svg{ width:25px;height:25px; }
  .gel-intro p{ font-size:23px;margin-top:4px; }
  .gel-pricing{ border-left:1px solid var(--fw-gold);padding-left:20px;font-size:14px;line-height:1.5;letter-spacing:.1em; }
  .gel-pricing .season{ color:var(--fw-burgundy); }
  .gel-pricing .offer{ font-size:20px;font-weight:600;letter-spacing:.08em; }
  .old-price{ text-decoration:line-through; }
  .save-badge{ width:80px;height:80px;border-radius:50%;background:var(--fw-burgundy);color:var(--fw-cream);display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;letter-spacing:.06em; }
  .closing-panel .script{ font-size:31px;text-align:right;margin:6px 12px;line-height:1.2; }
  .footer-bar{ border:1px solid var(--fw-gold);text-align:center;padding:8px 0;font-size:14px;letter-spacing:.13em; }
  .botanical{ position:absolute;width:150px;height:260px;opacity:.16;color:var(--fw-burgundy); }
  .botanical.tl{ left:-64px;top:-50px;transform:rotate(-25deg); }
  .botanical.tr{ right:-66px;top:-40px;transform:scaleX(-1) rotate(-25deg);color:var(--fw-gold-deep); }
  .botanical.bl{ left:-65px;bottom:-35px;transform:rotate(190deg);color:var(--fw-gold-deep); }
  .botanical.br{ right:-65px;bottom:-35px;transform:rotate(160deg); }
  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">

const { useEffect, useState, useRef, useMemo } = React;
const m = window.Motion.motion;
function App(){
  // staggered spring entry (same as slide 1)
  const springIn = (delay=0)=>({
    initial:{ opacity:0, y:40, scale:0.95 },
    animate:{ opacity:1, y:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const springInLeft = (delay=0)=>({
    initial:{ opacity:0, x:-50, scale:0.95 },
    animate:{ opacity:1, x:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const springInRight = (delay=0)=>({
    initial:{ opacity:0, x:50, scale:0.95 },
    animate:{ opacity:1, x:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const breathe = (phase=0)=>({
    animate:{ y: [0, -2, 0, 2, 0] },
    transition:{ duration:4, repeat:Infinity, ease:'easeInOut', delay: phase }
  });

  // gold border draw (same as slide 1)
  const GoldFrame = ({ r=28, delay=0.4, color="rgba(201,162,74,0.55)" })=> (
    <svg className="gold-frame" viewBox="0 0 100 100" preserveAspectRatio="none">
      <m.rect
        x="0.5" y="0.5" width="99" height="99" rx={r/2.4} ry={r/2.4}
        fill="none" stroke={color} strokeWidth="0.18"
        pathLength="1"
        initial={{ pathLength: 0, opacity: 0 }}
        animate={{ pathLength: 1, opacity: 1 }}
        transition={{ duration: 1.4, delay, ease: 'easeOut' }}
      />
    </svg>
  );


  const steps = [
    {title:'Warm Soak',body:'A warm, soothing soak to relax, soften and cleanse tired feet.',icon:<IconImg src="icon-warm-soak.png" alt="Warm soak"/>},
    {title:'Sugar Scrub',body:'Gently exfoliates dead skin cells for smooth, renewed feet.',icon:<IconImg src="icon-sugar-scrub.png" alt="Sugar scrub"/>},
    {title:'Cream Masque',body:'Deeply hydrates and nourishes dry, tired skin.',icon:<IconImg src="icon-cream-mask.png" alt="Cream masque"/>},
    {title:'Massage Lotion',body:'Nourishing lotion massage for silky softness and relaxation.',icon:<IconImg src="icon-lotion-massage.png" alt="Massage lotion"/>},
    {title:'Hot Stone Massage',body:'Warm stones melt away stress and improve circulation.',icon:<IconImg src="icon-hot-stone.png" alt="Hot stone massage"/>},
    {title:'Paraffin Treatment',body:'Locks in moisture and leaves skin incredibly soft.',icon:<IconImg src="icon-paraffin-wax.png" alt="Paraffin treatment"/>}
  ];
  return <>
    <div className="stage" aria-hidden="true">
      {[1,2,3].map((n)=><m.div key={n} className={'orb orb-'+n} animate={{x:[0,25,-15,0],y:[0,-18,12,0]}} transition={{duration:18+n*2,repeat:Infinity,ease:'easeInOut',delay:n*.4}}/>)}
      {['tl','tr','bl','br'].map(c=><BotanicalCorner key={c} corner={c}/>)}
    </div>
    <div className="content-frame">
      <m.div className="glass glass-strong header-row" {...springIn(.05)}>
        <GoldFrame delay={.5}/><HeaderRow/><DividerRule/>
      </m.div>
      <m.div className="glass glass-strong headline-panel" {...springIn(.15)}>
        <GoldFrame delay={.7}/>
        <h1><em>Two</em> Cozy Scents.<br/><em>One</em> Nourishing Pedicure.</h1>
        <p className="caps">A SIX-STEP SPA PEDICURE · TWO COZY SCENTS</p>
        <p className="intro">Choose <span>Golden Vanilla</span> or <span>Honey Oat</span> for a warm spa ritual made to hydrate, soften, and comfort.</p>
      </m.div>
      <m.div className="glass glass-strong choice-panel" {...springIn(.25)}>
        <GoldFrame delay={.85}/>
        <div className="choice-top"><div className="divider-rule"><PriceSeal/></div></div>
        <div className="scent-grid">
          <m.div {...springInLeft(.35)}><m.div {...breathe(.1)}><ScentCard photo="golden-vanilla-hero.png" photoAlt="Lit candle with vanilla orchid and vanilla bean pods" name="Golden Vanilla" notes="WARM · SWEET · LUXURIOUS" description="A rich vanilla experience with a touch of golden indulgence."/></m.div></m.div>
          <m.div className="or-badge" initial={{opacity:0,scale:0}} animate={{opacity:1,scale:1}} transition={{type:'spring',stiffness:280,damping:11,delay:.5}}><m.span animate={{scale:[1,1.05,1]}} transition={{duration:3,repeat:Infinity,ease:'easeInOut'}}>OR</m.span></m.div>
          <m.div {...springInRight(.4)}><m.div {...breathe(.35)}><ScentCard honey photo="honey-oat-hero.png" photoAlt="Jar of honey with a wooden dipper and a bowl of oats" name="Honey Oat" notes="NOURISHING · GENTLE · COMFORTING" description="A warm honey-oat experience made to soften and comfort."/></m.div></m.div>
        </div>
      </m.div>
      <m.div className="glass info-strip" {...springIn(.65)}>
        <GoldFrame delay={1}/>
        <InfoItem kind="calendar" title="LIMITED TIME ONLY" body="Treat yourself to the ultimate fall/winter escape."/>
        <InfoItem kind="leaf" title="RELAX. RENEW. GLOW." body="Healthy skin. Happy feet. You deserve it."/>
        <InfoItem kind="gift" title="ALSO AVAILABLE" body="Gift Certificates for the Perfect Treat!"/>
      </m.div>
      <m.div className="glass glass-strong ritual-panel" {...springIn(.85)}>
        <GoldFrame delay={1.3}/><DividerRule><h2 className="caps section-title">THE SIX-STEP SPA PEDICURE RITUAL</h2></DividerRule>
        <div className="steps">{steps.map((s,i)=><m.div className="step" key={s.title} initial={{opacity:0,y:18}} animate={{opacity:1,y:0}} transition={{delay:.85+i*.08,duration:.55,ease:'easeOut'}}>
          <div className="icon-frame"><m.span className="step-num" initial={{scale:0,opacity:0}} animate={{scale:1,opacity:1}} transition={{delay:.92+i*.08,type:'spring',stiffness:260,damping:14}}>{i+1}</m.span>{s.icon}</div><h3>{s.title}</h3><p>{s.body}</p>
        </m.div>)}</div>
      </m.div>
      <m.div className="glass glass-strong closing-panel" {...springIn(1.15)}>
        <GoldFrame delay={1.6}/><GelOffer/>
        <p className="script">Self Care Looks Good on Yours ♡</p>
        <FooterBar/>
      </m.div>
    </div>
  </>;
}

/* Self-contained editorial components for the carousel's visual system. */
function HeaderRow(){return <>
  <div><div className="caps wordmark" aria-label="DELUXE NAIL SPA">DELU<span>X</span>E NAIL SPA</div><div className="caps brand-subline">BEAUTY · CARE · RELAXATION</div></div>
  <div className="collection-lockup"><div className="caps collection-badge">FALL/WINTER COLLECTION<span>LIMITED TIME ONLY</span></div><p className="script">Warm Moments Beautiful Feet ♡</p></div>
</>;}
function DividerRule({children}){return <div className="divider-rule"><LeafIcon/>{children}{children && <LeafIcon/>}</div>;}
function PriceSeal(){return <div className="price-seal"><div className="caps">SPECIAL</div><div className="price-total">$59</div><div className="caps">INCLUDES</div><div className="price-inclusions">HOT STONE MASSAGE &amp;<br/>PARAFFIN TREATMENT</div></div>;}
function ScentCard({name,notes,description,photo,photoAlt,honey=false}){return <div className="scent-card"><div className={'scent-art'+(honey?' honey':'')}><img src={'assets/'+photo} alt={photoAlt} style={{width:'100%',height:'100%',objectFit:'cover',objectPosition:honey?'center 35%':'center 42%',display:'block'}}/></div><h2 className="ribbon-label">{name}</h2><p className="caps scent-notes">{notes}</p><p className="scent-description">{description}</p></div>;}
function InfoItem({kind,title,body}){return <div className="info-item"><InfoIcon kind={kind}/><h3 className="caps">{title}</h3><p>{body}</p></div>;}
function GelOffer(){return <div className="gel-strip">
  <div className="gel-intro"><h2 className="caps gel-title"><MapleIcon/>+ MAKE IT GEL!</h2><p>Upgrade to gel polish and get $5 OFF!</p></div>
  <div className="caps gel-pricing"><div>REGULAR GEL ADD-ON <span className="old-price">$15</span></div><div className="season">FALL/WINTER SPECIAL</div><div className="offer">GEL ADD-ON ONLY $10</div></div>
  <div className="caps save-badge">SAVE $5</div>
</div>;}
function FooterBar(){return <div className="caps footer-bar">DELUXE NAIL SPA · SMOOTHER FEET · BRIGHTER DAYS · A MORE BEAUTIFUL YOU</div>;}
function LeafIcon(){return <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20Q2 3 21 3Q21 21 4 20ZM4 20L16 8" stroke="currentColor" strokeWidth="1.4" fill="rgba(201,162,74,.12)"/></svg>;}
function MapleIcon(){return <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L15 8L18 6L17 11L22 10L19 16L13 18L13 23H11V18L5 16L2 10L7 11L6 6L9 8Z" fill="var(--fw-gold-deep)"/></svg>;}
function InfoIcon({kind}){
  if(kind==='leaf')return <LeafIcon/>;
  return <svg viewBox="0 0 24 24" fill="rgba(201,162,74,.12)" stroke="var(--fw-burgundy)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{kind==='calendar'?<><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10H20.5M8 3V7M16 3V7"/><circle cx="12" cy="15" r="1.5" fill="var(--fw-gold)"/></>:<><path d="M4 11H20V21H4ZM3 7H21V11H3ZM12 7V21"/><path d="M12 7C3 7 5 0 9 3ZM12 7C21 7 19 0 15 3Z"/></>}</svg>;
}
function BotanicalCorner({corner}){return <svg className={'botanical '+corner} viewBox="0 0 150 260" fill="none"><path d="M70 250Q110 125 55 10" stroke="currentColor" strokeWidth="2"/>{[0,1,2,3,4].map(n=><g key={n} transform={'translate(0 '+n*43+')'}><path d="M77 48Q12 35 34 3Q75 14 77 48ZM80 58Q135 40 121 13Q87 23 80 58Z" fill="currentColor"/></g>)}</svg>;}
function IconImg({src,alt}){return <img src={'assets/icons/'+src} alt={alt} style={{objectFit:'contain',display:'block'}}/>;}


ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
