<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>Deluxe Nail Spa — Green Tea Pedicure</title>

<!-- fonts vendored locally -->

<link href="../../vendor/fonts/fonts.css" rel="stylesheet">
<link href="../../vendor/fonts-editorial/fonts-editorial.css" rel="stylesheet">

<link href="../../vendor/mini-tw.css" rel="stylesheet">
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../vendor/framer-motion.js"></script>
<script src="../../vendor/babel.min.js"></script>

<style>
  img[src*="assets/icons/"]{ border-radius:50%; display:block; }

  :root{
    --cream-100:#F5E6D8;
    --cream-200:#E8D5C4;
    --cream-300:#D4B8A0;
    --blush:#E8C4B4;
    --sage:#B5C4A8;
    --gold:#B8965A;
    --gold-hi:#D4B886;
    --charcoal:#1F1B16;
    --charcoal-soft:rgba(31,27,22,0.78);
    --charcoal-muted:rgba(31,27,22,0.55);
    --glass-fill:rgba(255, 251, 246, 0.42);
    --glass-stroke:rgba(255, 255, 255, 0.55);
    --glass-shadow: 0 24px 60px -20px rgba(60, 40, 20, 0.22), 0 6px 16px -8px rgba(60, 40, 20, 0.16);

    /* Slide 9 — Green Tea fresh antioxidant accent (brighter leaf-tea green,
       distinct from slide 4 forest #2D4A3E and slide 7 sage #8CA38C) */
    --tea:#6E9A52;
    --tea-deep:#557A3D;
    --tea-soft:rgba(110,154,82,0.86);
    --tea-muted:rgba(110,154,82,0.55);
    --tea-leaf:#8FB86A;
    --tea-pale:#C2D9A6;

    --fw-cream:#F7ECD8;
    --fw-cream-deep:#F3E3C9;
    --fw-burgundy:#7A2130;
    --fw-burgundy-light:#8C2A3A;
    --fw-gold:#C9A24A;
    --fw-gold-deep:#B8862E;
    --fw-charcoal:#2B221A;
    --fw-charcoal-muted:rgba(43,34,26,0.62);
  }
  html, body{
    width:1080px; height:1920px; margin:0; padding:0;
    background:#E8D5C4;
    overflow:hidden;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--charcoal);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root{ width:1080px; height:1920px; position:relative; }
  .glass{
    position:relative;
    background: var(--glass-fill);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--glass-stroke);
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.45);
    border-radius: 28px;
    overflow:hidden;
  }
  .glass-strong{
    background: rgba(255, 251, 246, 0.58);
  }
  .glass::after{
    content:""; position:absolute; left:0; right:0; top:0; height:50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
    pointer-events:none;
  }
  .gold-frame{
    position:absolute; inset:0; pointer-events:none;
    border-radius:inherit;
  }


  *{ box-sizing:border-box; }
  body{ cursor:none; color:var(--fw-charcoal); font-family:'Cormorant Garamond',serif; }
  h1,h2,h3,p{ margin:0; }
  .stage{ position:absolute; inset:0; background:radial-gradient(ellipse at 0% 38%,rgba(122,33,48,.14),transparent 52%),radial-gradient(ellipse at 95% 82%,rgba(201,162,74,.24),transparent 55%),linear-gradient(165deg,var(--fw-cream),var(--fw-cream-deep)); }
  .orb{ position:absolute; border-radius:50%; filter:blur(60px); mix-blend-mode:multiply; opacity:.22; pointer-events:none; }
  .orb-1{ width:520px;height:520px;left:-180px;top:220px;background:radial-gradient(circle,var(--fw-burgundy),transparent 65%); }
  .orb-2{ width:600px;height:600px;right:-200px;top:640px;background:radial-gradient(circle,var(--fw-gold),transparent 65%); }
  .orb-3{ width:480px;height:480px;left:60px;bottom:-100px;background:radial-gradient(circle,var(--fw-burgundy-light),transparent 65%);opacity:.12; }
  .content-frame{ position:relative;width:100%;height:100%;padding:36px 44px;display:grid;grid-template-rows:150px 270px 620px 164px 340px 224px;gap:16px; }
  .glass::after{ z-index:0;opacity:.4; }
  .glass > :not(.gold-frame){ position:relative;z-index:1; }
  .caps{ font-family:'Cormorant SC',serif;text-transform:uppercase;letter-spacing:.12em;font-weight:600; }
  .script{ font-family:'Great Vibes',cursive;color:var(--fw-gold-deep);font-weight:400; }
  .header-row{ padding:20px 28px 12px;display:grid;grid-template-columns:1fr 1fr;align-items:center; }
  .wordmark{ font-size:35px;letter-spacing:.12em;white-space:nowrap; }
  .wordmark span{ color:var(--fw-gold-deep); }
  .brand-subline{ font-size:15px;margin-top:5px;letter-spacing:.2em; }
  .collection-lockup{ text-align:right; }
  .collection-badge{ display:inline-block;border:1px solid var(--fw-gold);border-radius:40px;padding:8px 23px;text-align:center;font-size:16px;line-height:1.35;color:var(--fw-burgundy); }
  .collection-badge span{ display:block;font-size:13px; }
  .collection-lockup .script{ font-size:29px;margin-top:6px; }
  .divider-rule{ display:flex;align-items:center;gap:12px;color:var(--fw-gold-deep); }
  .divider-rule:before,.divider-rule:after{ content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--fw-gold)); }
  .divider-rule:after{ transform:rotate(180deg); }
  .header-row .divider-rule{ grid-column:1/-1; }
  .divider-rule svg{ width:20px;height:20px;flex-shrink:0; }
  .headline-panel{ padding:16px 30px;text-align:center;display:flex;flex-direction:column;justify-content:center; }
  h1{ font-size:62px;line-height:.98;font-weight:400; }
  h1 em{ color:var(--fw-burgundy);font-weight:400; }
  .headline-panel .caps{ font-size:18px;margin-top:18px; }
  .intro{ font-size:26px;line-height:1.16;max-width:840px;margin:12px auto 0; }
  .intro span{ color:var(--fw-burgundy);font-weight:600; }
  .choice-panel{ padding:22px 28px; }
  .price-seal{ width:200px;height:200px;flex-shrink:0;border:1.5px solid var(--fw-gold);border-radius:50%;background:var(--fw-cream);color:var(--fw-burgundy);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 5px rgba(247,236,216,.6),0 8px 22px rgba(122,33,48,.08); }
  .price-seal .caps{ font-size:13px; }
  .price-total{ font-size:68px;font-weight:700;line-height:.94;margin:3px 0; }
  .price-inclusions{ font-size:14px;line-height:1.12;width:174px;margin-top:7px; }
  .ribbon-label{ display:inline-block;min-width:260px;border-radius:40px;background:var(--fw-burgundy);color:var(--fw-cream);font-size:33px;line-height:1.2;padding:6px 24px;margin-top:12px;font-weight:600; }
  .info-strip{ display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:22px 12px; }
  .info-item{ text-align:center;padding:0 12px; }
  .info-item + .info-item{ border-left:1px solid rgba(201,162,74,.6); }
  .info-item svg{ width:27px;height:27px;margin:0 auto 7px;display:block; }
  .info-item h3{ font-size:17px;color:var(--fw-burgundy);margin-bottom:7px; }
  .info-item p{ font-family:'Jost',sans-serif;font-size:12.5px;font-style:italic;line-height:1.35;white-space:nowrap; }
  .ritual-panel{ padding:24px 20px; }
  .section-title{ font-size:20px;white-space:nowrap; }
  .steps{ display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:30px; }
  .step{ text-align:center;position:relative; }
  .step:not(:last-child):after{ content:'›';position:absolute;right:-13px;top:20px;color:var(--fw-gold-deep);font-size:34px; }
  .icon-frame{ position:relative;width:76px;height:76px;border:1px solid var(--fw-gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;background:rgba(247,236,216,.6); }
  .icon-frame > svg{ width:44px;height:44px; }
  .step-num{ position:absolute;top:-7px;left:-6px;width:29px;height:29px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--fw-burgundy);border:1px solid var(--fw-gold);color:var(--fw-cream);font:500 16px 'Jost',sans-serif; }
  .step h3{ font-size:22px;line-height:1.02;min-height:46px;font-weight:600;margin-bottom:9px; }
  .step p{ font-family:'Jost',sans-serif;font-size:16px;line-height:1.28; }
  .closing-panel{ padding:14px 18px 12px;display:flex;flex-direction:column; }
  .closing-panel .script{ font-size:31px;text-align:right;margin:6px 12px;line-height:1.2; }
  .footer-bar{ border:1px solid var(--fw-gold);text-align:center;padding:8px 0;font-size:14px;letter-spacing:.13em; }
  .botanical{ position:absolute;width:150px;height:260px;opacity:.16;color:var(--fw-burgundy); }
  .botanical.tl{ left:-64px;top:-50px;transform:rotate(-25deg); }
  .botanical.tr{ right:-66px;top:-40px;transform:scaleX(-1) rotate(-25deg);color:var(--fw-gold-deep); }
  .botanical.bl{ left:-65px;bottom:-35px;transform:rotate(190deg);color:var(--fw-gold-deep); }
  .botanical.br{ right:-65px;bottom:-35px;transform:rotate(160deg); }
  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  .glass.glass-strong{ background:rgba(247,236,216,.92);border-color:rgba(201,162,74,.4);backdrop-filter:none;-webkit-backdrop-filter:none; }
  .content-frame{ grid-template-rows:135px 480px 300px 330px 413px 110px; }
  /* Rows 135+480+300+330+413+110=1768 + 5*16 gap + 2*36 padding = 1920. */
  .hero-img{width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block;}
  .hero-fallback{position:absolute;inset:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 25%,var(--fw-cream),transparent 65%),linear-gradient(170deg,var(--fw-gold),var(--fw-burgundy),var(--fw-charcoal));}
  .hero-vignette{position:absolute!important;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(43,34,26,.08) 20%,rgba(43,34,26,.18) 40%,rgba(43,34,26,.88) 100%),linear-gradient(90deg,rgba(43,34,26,.22),transparent 70%);}
  .hero-eyebrow-pill{position:absolute!important;z-index:1;top:28px;left:30px;padding:10px 18px;display:flex;align-items:center;gap:10px;border-radius:40px;background:rgba(247,236,216,.94);border:1px solid rgba(201,162,74,.65);color:var(--fw-burgundy);font-size:14px;}
  .hero-eyebrow-pill:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--fw-burgundy);}
  .hero-copy{position:absolute!important;z-index:1;left:40px;right:40px;bottom:38px;color:var(--fw-cream);text-shadow:0 2px 14px rgba(43,34,26,.4);}
  .hero-copy h1{font-size:70px;line-height:.98;font-weight:400;}
  .hero-copy h1 em{color:var(--tea-leaf,var(--fw-gold));font-style:italic;font-weight:400;}
  .hero-standfirst{font-size:22px;font-style:normal;font-family:'Jost',sans-serif;margin-top:14px;line-height:1.4;max-width:760px;}
  .experience-panel .promise{margin-top:0;}
  .headline-panel{ padding:26px 40px; }
  h1{ font-size:76px;line-height:1; }
  .intro{ font-family:'Jost',sans-serif;font-size:23px;line-height:1.4;max-width:820px;margin-top:22px; }
  .collection-badge{ max-width:390px;font-size:16px;padding:12px 20px; }
  .collection-lockup .brand-subline{ color:var(--fw-charcoal-muted); }
  .experience-panel{ padding:24px 36px;display:grid;grid-template-columns:1fr 240px;align-items:center;gap:32px; }
  .experience-art{ display:flex;align-items:center;justify-content:center;gap:24px; }
  .tea-art{ width:180px;height:180px;flex-shrink:0;border:1px solid var(--fw-gold);border-radius:90px 90px 24px 24px;background:radial-gradient(ellipse at 50% 35%,#fff9e9,transparent 65%),linear-gradient(135deg,#dfc18b,var(--fw-cream-deep),#cba260);display:flex;align-items:center;justify-content:center; }
  .tea-art svg{ width:146px;height:146px; }
  .promise{ font-size:40px;line-height:1.08;font-weight:400; }
  .promise em{ color:var(--fw-burgundy); }
  .ribbon-label{ min-width:0;font-size:18px;padding:8px 18px;margin:18px 0 0; }
  .secondary{ font-family:'Jost',sans-serif;font-size:19px;line-height:1.4;margin-top:16px; }
  .price-seal{ width:234px;height:234px; }
  .price-total{ font-size:49px;white-space:nowrap;margin:12px 0; }
  .price-inclusions{ font-family:'Jost',sans-serif;font-size:17px;line-height:1.35;width:190px; }
  .benefits-panel{ padding:24px 22px; }
  .info-strip{ grid-template-columns:repeat(3,1fr);padding:26px 0 0;align-items:start; }
  .info-item{ padding:0 16px; }
  .info-item svg{ width:34px;height:34px;margin-bottom:14px;color:var(--fw-burgundy); }
  .info-item h3{ font-size:21px;line-height:1.15;min-height:50px;letter-spacing:.06em; }
  .info-item p{ font-size:17px;line-height:1.4;white-space:normal;font-style:normal; }
  .ritual-panel{ padding:26px 28px; }
  .steps{ grid-template-columns:repeat(4,1fr);column-gap:24px;row-gap:26px;margin-top:28px; }
  .step:nth-child(4):after{ content:none; }
  .step h3{ font-size:25px;line-height:1.05;min-height:53px;margin-bottom:7px; }
  .step p{ font-size:16px;line-height:1.3;max-width:190px;margin:auto; }
  .icon-frame{ width:66px;height:66px;margin-bottom:12px; }
  .icon-frame > svg{ width:37px;height:37px; }
  .closing-panel{ justify-content:center;padding:22px 28px; }
  .footer-bar{ font-size:23px;padding:12px 0; }
  .promise{ margin-top:16px; }
  .ribbon-label{ margin-top:0; }
  .steps{ margin-top:44px; }
  .step p{ max-width:none;font-size:13px;white-space:nowrap; }
  .icon-frame{ width:86px;height:86px;margin-bottom:22px; }
  .icon-frame > svg{ width:50px;height:50px; }
  .info-item h3{ min-height:0;font-size:25px;margin-bottom:16px; }
  .info-item p{ font-size:21px; }
  .footer-bar{ font-size:18px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useEffect, useState, useRef, useMemo } = React;
const m = window.Motion.motion;
function App(){
  // staggered spring entry (same as slide 1)
  const springIn = (delay=0)=>({
    initial:{ opacity:0, y:40, scale:0.95 },
    animate:{ opacity:1, y:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const springInLeft = (delay=0)=>({
    initial:{ opacity:0, x:-50, scale:0.95 },
    animate:{ opacity:1, x:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const springInRight = (delay=0)=>({
    initial:{ opacity:0, x:50, scale:0.95 },
    animate:{ opacity:1, x:0, scale:1 },
    transition:{ type:'spring', stiffness:100, damping:15, delay }
  });

  const breathe = (phase=0)=>({
    animate:{ y: [0, -2, 0, 2, 0] },
    transition:{ duration:4, repeat:Infinity, ease:'easeInOut', delay: phase }
  });

  // gold border draw (same as slide 1)
  const GoldFrame = ({ r=28, delay=0.4, color="rgba(201,162,74,0.55)" })=> (
    <svg className="gold-frame" viewBox="0 0 100 100" preserveAspectRatio="none">
      <m.rect
        x="0.5" y="0.5" width="99" height="99" rx={r/2.4} ry={r/2.4}
        fill="none" stroke={color} strokeWidth="0.18"
        pathLength="1"
        initial={{ pathLength: 0, opacity: 0 }}
        animate={{ pathLength: 1, opacity: 1 }}
        transition={{ duration: 1.4, delay, ease: 'easeOut' }}
      />
    </svg>
  );


  const benefits = [
    { icon: <img src="assets/icons/icon-glow-sparkle.png" alt="Anti-aging renewal" style={{width:'34px',height:'34px',objectFit:'contain',margin:'0 auto 14px',display:'block'}}/>, title:'Anti-Aging',
      body:'Rich in antioxidants to protect and renew skin texture.' },
    { icon: <img src="assets/icons/icon-hydration-droplet.png" alt="Deep detox" style={{width:'34px',height:'34px',objectFit:'contain',margin:'0 auto 14px',display:'block'}}/>,   title:'Deep Detox',
      body:'Draws out impurities while soothing swollen feet.' },
    { icon: <img src="assets/icons/icon-aroma-candle.png" alt="Aromatherapy" style={{width:'34px',height:'34px',objectFit:'contain',margin:'0 auto 14px',display:'block'}}/>,   title:'Aromatherapy',
      body:'The subtle, fresh scent calms the mind and reduces stress.' },
  ];

  const steps = [
    {title:'Aromatic Green Tea Soak',body:'Immerse feet in fragrant green tea.',icon:<img src="assets/icons/icon-warm-soak.png" alt="Aromatic green tea soak" style={{width:'100%',height:'100%',objectFit:'contain'}}/>},
    {title:'Exfoliating Sugar Scrub',body:'Buff away dead skin with sugar.',icon:<img src="assets/icons/icon-sugar-scrub.png" alt="Exfoliating sugar scrub" style={{width:'100%',height:'100%',objectFit:'contain'}}/>},
    {title:'Hydrating Mud Mask',body:'Apply a mud mask to hydrate skin.',icon:<img src="assets/icons/icon-cream-mask.png" alt="Hydrating mud mask" style={{width:'100%',height:'100%',objectFit:'contain'}}/>},
    {title:'Relaxing Lotion Massage',body:'Massage with lotion for relaxation.',icon:<img src="assets/icons/icon-lotion-massage.png" alt="Relaxing lotion massage" style={{width:'100%',height:'100%',objectFit:'contain'}}/>},
  ];
  return <>
    <div className="stage" aria-hidden="true">
      {[1,2,3].map((n)=><m.div key={n} className={'orb orb-'+n} animate={{x:[0,25,-15,0],y:[0,-18,12,0]}} transition={{duration:18+n*2,repeat:Infinity,ease:'easeInOut',delay:n*.4}}/>)}
      {['tl','tr','bl','br'].map(c=><BotanicalCorner key={c} corner={c}/>)}
    </div>
    <div className="content-frame">
      <m.div className="glass glass-strong header-row" {...springIn(.05)}>
        <GoldFrame delay={.5}/><HeaderRow/><DividerRule/>
      </m.div>
      <m.div className="glass hero" {...springIn(.15)}>
        <m.div style={{width:'100%',height:'100%'}} initial={{scale:.95}} animate={{scale:[1,1.015,1]}} transition={{scale:{duration:5,repeat:Infinity,ease:'easeInOut'},opacity:{duration:1.4}}}>
          <img src="assets/green-tea-hero.png" alt="A ring of splashing water with fresh green tea leaves swirling through it in a misty bamboo forest, rippling into a still pool below"
            className="hero-img"
            onError={(e)=>{ e.currentTarget.style.display='none'; e.currentTarget.parentElement.insertAdjacentHTML('beforeend', '<div class=\"hero-fallback\"></div>'); }}/>
        </m.div>
        <div className="hero-vignette"/>
        <m.div className="caps hero-eyebrow-pill" initial={{opacity:0,y:-10}} animate={{opacity:1,y:0}} transition={{delay:.95,duration:.6}}>Deluxe Pedicure · Antioxidant Ritual</m.div>
        <m.div className="hero-copy" initial={{opacity:0,y:24}} animate={{opacity:1,y:0}} transition={{delay:1,duration:.7,ease:'easeOut'}}>
          <h1>Green <em>Tea</em> Pedicure</h1>
          <p className="hero-standfirst">Rejuvenate your soles with nature's most powerful antioxidant.</p>
        </m.div><GoldFrame delay={.7}/>
      </m.div>
      <m.div className="glass glass-strong experience-panel" {...springIn(.25)}>
        <GoldFrame delay={.85}/>
        <m.div {...springInLeft(.35)}><m.div {...breathe(.1)}>
          <p className="caps ribbon-label">The Promise</p><h2 className="promise">Renew. Detox. <em>Calm.</em></h2><p className="secondary">Antioxidant-rich green tea for tired feet</p>
        </m.div></m.div>
        <m.div {...springInRight(.4)}><PriceSeal/></m.div>
      </m.div>
      <m.div className="glass glass-strong benefits-panel" {...springIn(.65)}>
        <GoldFrame delay={1}/><DividerRule><h2 className="caps section-title">Why Choose Green Tea?</h2></DividerRule>
        <div className="info-strip">{benefits.map(b=><InfoItem key={b.title} {...b}/>)}</div>
      </m.div>
      <m.div className="glass glass-strong ritual-panel" {...springIn(.85)}>
        <GoldFrame delay={1.3}/><DividerRule><h2 className="caps section-title">The Four-Step Green Tea Ritual</h2></DividerRule>
        <div className="steps">{steps.map((s,i)=><m.div className="step" key={s.title} initial={{opacity:0,y:18}} animate={{opacity:1,y:0}} transition={{delay:.85+i*.08,duration:.55,ease:'easeOut'}}>
          <div className="icon-frame"><m.span className="step-num" initial={{scale:0,opacity:0}} animate={{scale:1,opacity:1}} transition={{delay:.92+i*.08,type:'spring',stiffness:260,damping:14}}>{i+1}</m.span>{s.icon}</div><h3>{s.title}</h3><p>{s.body}</p>
        </m.div>)}</div>
      </m.div>
      <m.div className="glass glass-strong closing-panel" {...springIn(1.15)}>
        <GoldFrame delay={1.6}/><FooterBar/>
      </m.div>
    </div>
  </>;
}
function HeaderRow(){return <>
  <div><div className="caps wordmark" aria-label="DELUXE NAIL SPA">DELU<span>X</span>E NAIL SPA</div><div className="caps brand-subline">BEAUTY · CARE · RELAXATION</div></div>
  <div className="collection-lockup"><div className="caps collection-badge">Antioxidant Pedicure · Deluxe House</div><p className="caps brand-subline">Cary, NC</p></div>
</>;}
function PriceSeal(){return <div className="price-seal"><div className="caps">Deluxe Pedicure</div><div className="price-total">From $45</div><p className="price-inclusions">{'Gel polish & add-ons available'}</p></div>;}
function InfoItem({icon,title,body}){return <div className="info-item">{icon}<h3 className="caps">{title}</h3><p>{body}</p></div>;}
function FooterBar(){return <div className="caps footer-bar">DELUXE NAIL SPA · ANTIOXIDANT PEDICURE · CARY, NC</div>;}
